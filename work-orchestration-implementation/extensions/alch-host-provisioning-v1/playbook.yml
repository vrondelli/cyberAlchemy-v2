---
- name: Configure disposable Alch capacity fixture
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Create isolated target directories
      ansible.builtin.file:
        path: "{{ target_root }}/{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - config
        - state
    - name: Materialize bounded runtime configuration
      ansible.builtin.copy:
        dest: "{{ target_root }}/config/host.json"
        content: "{{ host_config | to_json }}\n"
        mode: '0600'
