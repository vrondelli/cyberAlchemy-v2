- id: agent-default-model
  config:
    provider: glm-canary
    model: glm-5.3-flash
- id: llm-pi-ai
  config:
    providers:
      glm-canary:
        api: openai-completions
        baseURL: http://are-dsh-canary-proxy:8080/v1
        apiKeyEnv: CANARY_PLACEHOLDER
        defaultContextWindow: 32768
        defaultMaxTokens: 1024
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: glm-5.3-flash
            contextWindow: 32768
            maxTokens: 1024
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
