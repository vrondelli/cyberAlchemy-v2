- insert:
    - id: are-benchmark-tools
      name: /repo/development/agent-reasoning-engine/planning/representation-preferences/dual-benchmark-8k-v2/contextbench/deepseek-headless-plugin.mjs
      config:
        payload_encoding: source-dictionary-v1
        work_root: /work
        base_root: /base
        evidence_root: /evidence
        base_commit: 0d8c794d2ac7acc171ea7741c71100391cf70faf

- id: compaction-basic
  config:
    thresholdRatio: 0.146484375
    retainTokens: 800
    maxTokens: 1800
    compactionRetries: 1
    maxOverflowRetries: 1

- id: system-prompt
  config:
    personaSuffix: "When producing a checkpoint or carried memory, use at most 350 words including required headings. Preserve the original objective, unresolved constraints, exact relevant source read IDs and paths, changes actually made, test outcomes, and one next action. Keep required sections; use terse bullets and (none) for empty sections. Merge duplicate facts, remove stale speculation, and refer to source IDs instead of copying source text or full tool payloads. Do not invent progress or omit unresolved failures to meet the target.\nSearch results may use observation_encoding: source-dictionary-v1. Each observation source_ref indexes sources; merge that source record with the observation. derived_retrieval_handle:true means retrieval_handle is observed-read: followed by read_id. All source text and provenance fields are retained."
