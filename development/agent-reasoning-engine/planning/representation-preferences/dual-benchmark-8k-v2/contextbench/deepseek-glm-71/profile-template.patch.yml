- id: agent-default-model
  config:
    provider: glm-canary
    model: glm-5.3-flash
- id: llm-pi-ai
  config:
    providers:
      glm-canary:
        api: openai-completions
        baseURL: http://are-dsh-profile-60:8080/v1
        apiKeyEnv: CANARY_PLACEHOLDER
        reasoning: low
        compat:
          thinkingFormat: zai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        defaultContextWindow: 32768
        defaultMaxTokens: 1800
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: glm-5.3-flash
            contextWindow: 32768
            maxTokens: 1800
            reasoningEfforts:
              low: low
