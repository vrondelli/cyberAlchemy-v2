- id: agent-default-model
  config:
    provider: glm-canary
    model: glm-5.3-flash
- id: llm-pi-ai
  config:
    providers:
      glm-canary:
        api: openai-completions
        baseURL: http://are-native64-1-dsh-proxy:8080/v1
        apiKeyEnv: CANARY_PLACEHOLDER
        reasoning: low
        compat:
          thinkingFormat: zai
          supportsReasoningEffort: true
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        defaultContextWindow: 8000
        defaultMaxTokens: 2048
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: glm-5.3-flash
            contextWindow: 8000
            maxTokens: 2048
            reasoningEfforts:
              low: low
