ledger_id: craft.cav2.agent_reasoning_engine
schema_ref: "[repo-root]/arcanum/arcana/craft/templates/ledger.schema.yml"
schema_version: 0.3.0
status: candidate-local
source_of_truth: .craft/ledger.yml
human_view: CRAFT.md
notes:
  - Fresh private Craft scope for the agent reasoning engine authoring dispatch.
  - This ledger does not validate, repair, or claim conformance for the parent cyberAlchemy-v2 Craft ledger.
  - Local definitions remain candidates; canonical definitions and public Arcanum are outside this scope.

