contexts:
  - context_id: CTX-ARE-ROOT
    parent_id: root
    title: Agent reasoning engine authoring
    purpose: >-
      Coordinate an evidence-informed private definition, design, and plan for a governed
      agent reasoning engine whose first executable witness will be semantic-judgment
      evaluator@1.
    stage: implementation-l0
    gate: pass
    next_move: Run the explicit G-ARE-L0 evidence/owner promotion gate; do not select or authorize a downstream SWU until that gate returns a terminal receipt.
    owned_artifacts:
      - ART-ARE-DISPATCH
      - ART-ARE-LEDGER
      - ART-ARE-INDEX
      - ART-ARE-VIEW
      - ART-ARE-CRAFT-START-RECEIPT
      - ART-ARE-INTENT-LIVE-RECEIPT
      - ART-ARE-ENGINE-PLAN-RECEIPT
      - ART-ARE-CRAFT-REFRESH-RECEIPT
      - ART-ARE-READINESS-RECEIPT
      - ART-ARE-L0-WITNESS-RECEIPT
    links:
      - label: Intent-schema evidence gap
        target: GAP-ARE-INTENT-SCHEMA-EVIDENCE
        kind: row-id
      - label: Semantic witness gap
        target: GAP-ARE-SEMANTIC-WITNESS
        kind: row-id
      - label: Plan receipt
        target: ART-ARE-ENGINE-PLAN-RECEIPT
        kind: artifact-id
      - label: Readiness receipt
        target: ART-ARE-READINESS-RECEIPT
        kind: artifact-id
      - label: L0 witness receipt
        target: ART-ARE-L0-WITNESS-RECEIPT
        kind: artifact-id
      - label: Application authority blocker
        target: BLK-ARE-APP-001
        kind: row-id
      - label: Challenge contract blocker
        target: BLK-ARE-CHAL-001
        kind: row-id
      - label: Effect gate blocker
        target: BLK-ARE-EFFECT-001
        kind: row-id
    notes: >-
      Run-02 remains the admitted intent evidence. G-ARE-POLICY passes and
      SWU-ARE-001 completed with a passing private L0 witness. The semantic-witness
      gap is closed, but G-ARE-L0 promotion and all downstream gaps remain open.

artifacts:
  - artifact_id: ART-ARE-DISPATCH
    owner_context_id: CTX-ARE-ROOT
    path: DISPATCH.json
    artifact_type: validated-dispatch
    status: pass
    notes: Validated route contract for the confirmed authoring run.
  - artifact_id: ART-ARE-LEDGER
    owner_context_id: CTX-ARE-ROOT
    path: .craft/ledger.yml
    artifact_type: ledger-source
    status: active
    notes: Machine-readable Craft source of truth for this scoped context.
  - artifact_id: ART-ARE-INDEX
    owner_context_id: CTX-ARE-ROOT
    path: .craft/index.json
    artifact_type: generated-index
    status: active
    notes: Rebuildable lookup projection pinned to the source ledger hash.
  - artifact_id: ART-ARE-VIEW
    owner_context_id: CTX-ARE-ROOT
    path: CRAFT.md
    artifact_type: human-view
    status: active
    notes: Navigable human projection of the scoped ledger.
  - artifact_id: ART-ARE-CRAFT-START-RECEIPT
    owner_context_id: CTX-ARE-ROOT
    path: receipts/craft-context.json
    artifact_type: execution-receipt
    status: pass
    notes: Native-stage receipt for the Craft start operation.
  - artifact_id: ART-ARE-RESEARCH-FINDINGS
    owner_context_id: CTX-ARE-ROOT
    path: "[repo-root]/projects/cyberalchemy-orchestrator/docs/research/2026-07-22-agent-reasoning-engine-contract/findings.md"
    artifact_type: accepted-research
    status: pass
    notes: Read-only accepted findings; the orchestrator repository is outside the write scope.
  - artifact_id: ART-ARE-INTENT-LIVE-RECEIPT
    owner_context_id: CTX-ARE-ROOT
    path: receipts/intent-schema-live-run.json
    artifact_type: execution-receipt
    status: flag
    notes: >-
      Terminal run-02 receipt admitted at g6 under Option A. Its bounded result remains
      flag; run-01 remains invalid and contributes no admitted live evidence.
  - artifact_id: ART-ARE-ENGINE-PLAN-RECEIPT
    owner_context_id: CTX-ARE-ROOT
    path: receipts/engine-plan.json
    artifact_type: planning-receipt
    status: block
    notes: >-
      Stage s9 plan structure passes, while its implementation handoff is blocked.
      SWU-ARE-001 is selected but not authorized.
  - artifact_id: ART-ARE-CRAFT-REFRESH-RECEIPT
    owner_context_id: CTX-ARE-ROOT
    path: .craft/artifacts/receipts/craft-refresh.json
    artifact_type: craft-refresh-receipt
    status: pass
    notes: Terminal receipt for the s10 Craft refresh.
  - artifact_id: ART-ARE-READINESS-RECEIPT
    owner_context_id: CTX-ARE-ROOT
    path: decisions/implementation-readiness/session-evidence/TASK-ARE-READINESS-001-RECEIPT.json
    artifact_type: execution-receipt
    status: pass
    notes: >-
      Terminal Task Session receipt closing the three policy-readiness blockers
      without authorizing implementation or claiming an evaluator witness.
  - artifact_id: ART-ARE-L0-WITNESS-RECEIPT
    owner_context_id: CTX-ARE-ROOT
    path: "[repo-root]/cyberAlchemy-v2/implementation/agent-reasoning-engine/generated/runs/evaluator-v1-20260723T-session-001/TERMINAL-RECEIPT.json"
    artifact_type: execution-receipt
    status: pass
    notes: >-
      Terminal SWU-ARE-001 receipt witnessing one private finite semantic relation.
      It does not promote G-ARE-L0 or admit a broader reasoning-engine claim.

descriptions:
  - description_id: DESC-ARE-ROOT
    context_id: CTX-ARE-ROOT
    description: >-
      The repository has governance and coordination machinery but no witnessed
      problem-level semantic reduction engine. This context authors that engine while
      keeping its first evaluator and intent record explicitly candidate and unwitnessed.
    status: superseded
    evidence: ART-ARE-RESEARCH-FINDINGS
  - description_id: DESC-ARE-POST-PLAN
    context_id: CTX-ARE-ROOT
    description: >-
      The private definition, design, and high-complexity plan are complete. Run-02
      remains the admitted intent evidence. G-ARE-POLICY passes and SWU-ARE-001
      now witnesses one finite semantic relation; G-ARE-L0 promotion remains pending.
    status: active
    evidence: ART-ARE-L0-WITNESS-RECEIPT

definitions:
  - definition_id: DEF-ARE-INTENT-RECORD
    scope_id: CTX-ARE-ROOT
    term: intent record
    statement: >-
      A candidate machine-readable projection of governed Intent that preserves source,
      purpose, scope, constraints, target pressure, current output hypothesis, and an
      explicit revision route while marking whether each value was declared, inferred,
      or unresolved.
    status: candidate
    evidence: ART-ARE-DISPATCH
  - definition_id: DEF-ARE-SEMANTIC-EVALUATOR
    scope_id: CTX-ARE-ROOT
    term: semantic-judgment evaluator@1
    statement: >-
      An implemented finite private L0 witness that accepts a frozen bounded request,
      produces one typed semantic judgment plus reasoning receipt, and neither
      authorizes nor performs a real effect.
    status: candidate-witnessed
    evidence: ART-ARE-L0-WITNESS-RECEIPT

gaps:
  - gap_id: GAP-ARE-INTENT-SCHEMA-EVIDENCE
    scope_id: CTX-ARE-ROOT
    summary: >-
      The seven-field intent projection has not yet been populated against repository-local
      records or tested on a held-out slice, so its field boundary remains a hypothesis.
    severity: flag
    treatment: completed-bounded-run-and-owner-admission
    owner: research-evidence-harness plus task-session
    status: closed
    evidence: ART-ARE-INTENT-LIVE-RECEIPT
    links:
      - label: Authoring dispatch
        target: ART-ARE-DISPATCH
        kind: artifact-id
      - label: Admitted run-02 receipt
        target: ART-ARE-INTENT-LIVE-RECEIPT
        kind: artifact-id
  - gap_id: GAP-ARE-SEMANTIC-WITNESS
    scope_id: CTX-ARE-ROOT
    summary: >-
      semantic-judgment evaluator@1 now has executable, two-family, replayable,
      exact-effect-test-double witness evidence within its L0 claim ceiling.
    severity: flag
    treatment: completed-bounded-l0-witness
    owner: task-session
    status: closed
    evidence: ART-ARE-L0-WITNESS-RECEIPT
    links:
      - label: Terminal L0 witness receipt
        target: ART-ARE-L0-WITNESS-RECEIPT
        kind: artifact-id
  - gap_id: GAP-ARE-ARTIFACT-DURABILITY
    scope_id: CTX-ARE-ROOT
    summary: Artifact durability and admission remain an L2 owner decision.
    severity: flag
    treatment: defer-to-owner-readiness
    owner: artifact-admission owner
    status: active
    evidence: ART-ARE-ENGINE-PLAN-RECEIPT
  - gap_id: GAP-ARE-INCIDENT-READINESS
    scope_id: CTX-ARE-ROOT
    summary: Incident behavior and operational response remain downstream residue, not witnessed behavior.
    severity: flag
    treatment: defer-to-later-readiness
    owner: incident-policy owner
    status: active
    evidence: ART-ARE-ENGINE-PLAN-RECEIPT
  - gap_id: GAP-ARE-ROLLOUT-READINESS
    scope_id: CTX-ARE-ROOT
    summary: Rollout and promotion conditions remain downstream; the general reasoning-engine label is unsupported.
    severity: flag
    treatment: defer-to-owner-admission
    owner: rollout and promotion owners
    status: active
    evidence: ART-ARE-ENGINE-PLAN-RECEIPT
  - gap_id: GAP-ARE-INTENT-EVIDENCE
    scope_id: CTX-ARE-ROOT
    summary: Intent revision-history and inter-rater evidence remain outside the first evaluator witness.
    severity: flag
    treatment: future-evidence-run
    owner: intent-contract and evidence owners
    status: active
    evidence: ART-ARE-INTENT-LIVE-RECEIPT
  - gap_id: GAP-ARE-ANTI-BIAS-EFFICACY
    scope_id: CTX-ARE-ROOT
    summary: Anti-bias efficacy remains explicitly excluded from the plan and first witness.
    severity: flag
    treatment: future-efficacy-evidence
    owner: anti-bias evidence owner
    status: active
    evidence: ART-ARE-ENGINE-PLAN-RECEIPT

