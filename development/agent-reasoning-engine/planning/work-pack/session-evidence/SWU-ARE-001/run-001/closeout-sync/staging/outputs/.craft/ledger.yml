decisions:
  - decision_id: DEC-ARE-G6-SCHEMA-SELECTION
    scope_id: CTX-ARE-ROOT
    question: Which bounded intent-schema evidence should be admitted for definition and design reconciliation?
    description: Run-02 reached g6 with flags; run-01 was invalidated by its stale frozen inputs.
    impact: Governs the local evidence basis only; it does not promote a schema or authorize implementation.
    options:
      - Option A
      - reject run-02
      - defer
    selected_option: Option A
    rationale: Admit run-02 as bounded, revisable evidence while retaining its flags and excluding run-01.
    status: closed
    blocking: true
    evidence: ART-ARE-CRAFT-REFRESH-RECEIPT
    links:
      - label: Run-02 terminal receipt
        target: ART-ARE-INTENT-LIVE-RECEIPT
        kind: artifact-id
