schema_contract:
  id: agent_reasoning_engine.beginner_guide
  version: "0.3"
  based_on: whisper.text_intent_substrate@0.1
  purpose: >
    A human-readable and machine-readable writing contract for revising the
    Agent Reasoning Engine beginner guide. It controls teaching order,
    language, evidence limits, and review checks; it is not runtime authority.

text_intent_substrate:
  metadata:
    substrate_version: "0.1"
    artifact_revision: "0.3"
    schema_id: agent_reasoning_engine.beginner_guide
    transport_type: adjacent_project_onboarding_guide
    transport_proof_status: candidate_unproven
    artifact_status: candidate_synchronized_pending_teammate_review
    intent_state: frozen
    source_state_as_of: 2026-08-13
    authority_effect: none
    privacy: private_cav2
    source_guide: BEGINNER-GUIDE.md
    target_guide: BEGINNER-GUIDE.md

  source_context:
    user_need: >
      Introduce the author of cyberalchemy-orchestrator to the separate Agent
      Reasoning Engine. Use their orchestration and ACI experience as a bridge
      so they can understand the semantic boundary, run both packages, trace
      examples, and join a safely scoped task without being retaught concepts
      they already work with.
    user_supplied_context:
      claim: The target teammate made projects/cyberalchemy-orchestrator.
      evidence_kind: user_assertion
      use_allowed: tailor_audience_and_voice
      use_not_allowed:
        - prove current recall of every orchestrator subsystem
        - prove authorship from repository bytes
        - authorize reasoning-engine implementation
    observed_problem: >
      The first draft is technically useful but introduces internal vocabulary
      before the reader understands the behavior. The later cross-project
      draft improved the audience fit, but its generic stakeholder request did
      not show how this teammate actually governs multi-agent research.
    current_guide_state: rewritten_pending_teammate_review
    primary_sources:
      current_lifecycle_state:
        - .craft/ledger.yml
        - CRAFT.md
        - planning/WORK-PACK.md
      whole_engine_meaning:
        - spec/SPEC.md
        - spec/GLOSSARY.md
        - design/ARCHITECTURE.md
        - design/COMPONENT-CONTRACTS.md
      implemented_behavior:
        - ../../implementation/agent-reasoning-engine/packages/semantic-judgment-evaluator/
        - ../../implementation/agent-reasoning-engine/packages/intent-route-resolver/
      beginner_examples:
        - ../../implementation/agent-reasoning-engine/fixtures/evaluator-v1/refund-eligibility.json
        - ../../implementation/agent-reasoning-engine/packages/intent-route-resolver/test/fixtures/witness/cases.json
      audience_bridge:
        - ../../../projects/cyberalchemy-orchestrator/AGENTS.md
        - ../../../projects/cyberalchemy-orchestrator/README.md
        - ../../../projects/cyberalchemy-orchestrator/implementations/README.md
        - ../../../projects/cyberalchemy-orchestrator/docs/features/agent-provenance-telemetry/integration/stage-e/local-orchestration-logging-bridge.md
        - ../../../projects/cyberalchemy-orchestrator/docs/features/agent-provenance-telemetry/integration/stage-f/mandatory-host-wrapper.md
        - ../../../projects/cyberalchemy-orchestrator/definitions/DEFINITIONS.md
      research_dispatch_governance:
        - ../../../implementation/domainspec/internal_tools/subagents-dispatch-hooks/skills/domainspec-subagents-strategy/SKILL.md
        - ../../../implementation/domainspec/internal_tools/subagents-dispatch-hooks/skills/research/SKILL.md

  intake_decisions:
    interview_mode: voice_approval
    questions_asked: 1
    correction_events:
      - date: 2026-08-13
        scope: relevance_core_and_trajectory_core
        correction: target_reader_authored_cyberalchemy_orchestrator
        source: user_supplied_context
        effect: previous_voice_approval_superseded_and_intent_marked_volatile
      - date: 2026-08-13
        scope: orchestrator_bridge_example
        correction: replace_generic_stakeholder_request_with_governed_research_dispatch
        source: user_direction
        effect: research_dispatch_selected_as_example_without_registering_or_running_one
    operator_voice_approval: approved
    operator_voice_approved_on: 2026-08-13
    previously_approved_direction: concrete_conversational_explanation_first
    candidate_direction: concrete_research_dispatch_then_engine_difference
    rejected_direction: governance_manual_opening
    remaining_human_gate: teammate_comprehension
    revised_language_audition:
      status: approved
      opening: >
        You already built an orchestrator that can refuse an agent launch when
        its required binding or lifecycle evidence is missing. The Agent
        Reasoning Engine explores a different decision: given fixed facts and
        rules, what conclusion follows? Two small reasoning packages work
        locally today, but they are not connected to the orchestrator or to
        each other as a complete engine. Their answers are advice, not
        permission.
      bridge: >
        Think of a reasoning snapshot as similar to the exact inputs and
        digests your ACI bridge binds before launch: it fixes the information
        used for one decision so the result can be traced. The similarity ends
        there. A reasoning snapshot is not an ACI event, ledger row, or
        projection, and an evaluator recommendation is not
        status=launch-authorized.
      contribution: >
        Start with the boundary, not another introduction to governance. Run
        both package suites, trace one refund decision and one route decision,
        then compare three separate results: dispatch launch authorization,
        semantic recommendation, and exact-effect permission. Before editing,
        apply the same admission discipline you use in the orchestrator: the
        reasoning-engine documents currently disagree about the next task, so
        a green suite still does not select an SWU.
      research_dispatch_example: >
        Ask whether the Agent Reasoning Engine can use ACI-owned journal facts
        without becoming a second lifecycle writer. Show the dispatch trigger,
        read-only Inventory map, validated sheet, two independent challenge
        passes, explicit human confirmation, registration, research roles,
        evidence closure, writing, auditing, and closeout. Then stop: closed
        findings are evidence, not authority, and no current runtime edge feeds
        them into a reasoning snapshot.

  author_objective:
    primary_outcome: >
      Use a governed research dispatch from the teammate's orchestration mental
      model to expose the reasoning engine's distinct semantic role, then give
      them enough local context to run both packages, trace one example in
      each, and participate in a scoped code discussion.
    desired_reader_change:
      from: >
        I understand governed dispatch and ACI, but I do not yet know where the
        reasoning engine begins, what it owns, or which parts actually run.
      to: >
        I can distinguish launch authorization, route advice, semantic
        recommendation, and effect permission; I understand the two working
        packages, the absent integration, and a safe place to begin.
    success_signal: >
      The teammate can explain where orchestrator authority ends and
      reasoning-engine responsibility begins, then retell both package flows
      and their limits without copying the guide's formal vocabulary.
    author_stance: peer_to_peer_cross_project_onboarding

  resonance_core:
    tone:
      - conversational
      - calm
      - direct
      - honest_about_limits
      - respectful_of_adjacent_system_expertise
    voice:
      - use_you_and_we_sparingly
      - prefer_common_verbs
      - explain_before_naming
      - use_familiar_orchestrator_patterns_as_bridges
      - name_where_each_analogy_stops
      - sound_like_a_peer_not_a_policy_manual_or_basic_tutorial
    style_register: adjacent_system_expert_new_to_local_domain
    emotional_residue:
      - I know what works.
      - I know what does not work yet.
      - I know how this differs from the system I built.
      - I know where to start.
      - I know when to ask before changing something.
    value_signal: clarity_without_claim_inflation
    forbidden_feels:
      - governance_receipt
      - architecture_thesis
      - acronym_wall
      - sales_pitch
      - false_simplicity
      - condescending_reteaching_of_orchestrator_basics
      - same_word_means_same_contract
      - implied_cross_project_integration

  relevance_core:
    target_public: cyberalchemy_orchestrator_author_new_to_agent_reasoning_engine
    reader_identity_evidence:
      authorship: user_supplied_context
      repertoire_basis: current_orchestrator_repository_sources
      confidence_limit: familiarity_with_patterns_not_guaranteed_recall_of_every_current_detail
    reader_state:
      transferable_knowledge:
        - mixed Python and Node repository navigation and test execution
        - append-only opening and closing records
        - explicit human confirmation and fail-closed launch authorization
        - operation-specific capabilities, exact digests, and authorization evidence
        - ACI and APT sessions, dispatch links, journals, projections, and recovery
        - idempotent retry and preservation of partial work
        - SWU boundaries and claim <= proof discipline
      engine_specific_unknowns:
        - the semantic question this engine owns instead of orchestration
        - the evaluator request, snapshot, catalog, eight outcomes, and reasoning receipt
        - the resolver request, fixed route list, ambiguity, ranking, and four results
        - the two package code paths, fixtures, tests, and exact claim limits
        - the current CAV2 source hierarchy and planning disagreement
        - the proposed ACI-subordinate seam and the absence of current integration
      similar_terms_that_need_disambiguation:
        - term: gate
          engine_job: control evaluator entry or one exact test effect
          orchestrator_job: control an agent launch or dispatch transition
        - term: receipt
          engine_job: record a semantic derivation under fixed inputs
          orchestrator_job: record lifecycle and authorization evidence
        - term: snapshot
          engine_job: hold the exact inputs used for one semantic evaluation
          orchestrator_job: not an ACI event, ledger row, or projection synonym
        - term: replay
          engine_job: rerun retained historical evaluation inputs without fresh calls
          orchestrator_job: rebuild or inspect accepted event projections and lifecycle
        - term: authority
          engine_job: own semantic rules, inputs, and result boundaries
          orchestrator_job: own dispatch, capability, Session, and lifecycle boundaries
      does_not_need_reteaching_from_zero:
        - ACI
        - APT
        - SWU
        - append-only ledger
        - capability
        - confirmation
        - digest
        - gate
        - idempotency
        - projection
        - receipt
      must_not_assume:
        - familiarity with current reasoning-engine bytes
        - that similarly named concepts share one schema or owner
        - that the teammate recalls every current orchestrator subsystem
        - that orchestrator authorship grants reasoning-engine authority
    domain: private_cross_project_reasoning_engine_onboarding
    authority_mode: source_grounded_no_authority_effect
    likely_questions:
      - Where does semantic reasoning begin after orchestration ends?
      - What actually works today?
      - Which familiar ACI patterns transfer, and where do the analogies stop?
      - How do route advice, semantic recommendation, and effect permission differ?
      - What is and is not currently integrated with cyberalchemy-orchestrator?
      - How can closed research inform reasoning without becoming automatic input or authority?
      - What should I run and compare first?
      - What may I safely change?
    reader_reward: map_owned_orchestrator_concepts_to_reasoning_engine_boundaries

  trajectory_core:
    narrative_anchor: governed_research_dispatch_versus_semantic_judgment
    primary_example: can_reasoning_use_aci_journal_facts_without_becoming_a_lifecycle_writer
    secondary_example: a_refund_review_that_must_not_send_a_refund
    transport_type: adjacent_project_onboarding_guide
    introduction_strategy: concrete_research_dispatch_then_difference_then_current_truth
    body_parts:
      - research_dispatch_to_reasoning_bridge
      - what_exists_today
      - refund_story
      - evaluator_walkthrough
      - resolver_walkthrough
      - aci_subordinate_integration_boundary
      - source_map
      - first_ninety_minutes
      - safe_contribution_boundary
      - compact_reference
    ending_strategy: readiness_check_in_the_readers_own_words
    must_include:
      - two implemented sibling packages
      - complete engine is not implemented
      - Advice is not permission.
      - orchestrator launch authorization is not semantic recommendation
      - explicit human confirmation occurs before dispatch registration
      - research.md preserves verbatim explorer returns
      - findings.md is authored only after evidence closure
      - closed research findings are evidence, not authority or automatic reasoning input
      - existing orchestrator ACI is not current reasoning-engine integration
      - every cross-project analogy states both similarity and difference
      - no real product effect
      - exact commands for both test suites
      - one traceable example per package
      - current planning documents disagree about the next task
      - private CAV2 boundary
    must_avoid:
      - opening with lifecycle status IDs
      - explaining ACI, SWUs, ledgers, gates, receipts, or digests as if they are new concepts
      - presenting the packages as one wired pipeline
      - presenting the orchestrator as a reasoning engine
      - treating same-name concepts as one shared contract
      - treating a passing test as permission to implement
      - treating recommendation or candidate as action approval
      - treating historical evidence as current product readiness
      - treating research closeout as proof that a finding is true
      - drawing a current findings-to-reasoning runtime edge
      - presenting the research-dispatch example as an active registered run

  language_policy:
    core_rule: familiar_orchestrator_pattern_then_difference_then_engine_term
    secondary_rule: concrete_example_then_behavior_then_exact_term
    paragraph_rule: one_main_idea_per_paragraph
    analogy_contract:
      every_cross_project_analogy_must_state:
        - the shared structural pattern
        - the different responsibility or owner
        - the specific false equivalence to avoid
      preferred_form: This is similar because X. It differs because Y. Do not use it to infer Z.
      forbidden_shortcuts:
        - reasoning snapshot equals ACI event or projection
        - evaluator entry gate equals host launch authorization
        - reasoning receipt equals dispatch lifecycle receipt
        - route candidate equals selected or launched capability
        - existing ACI pilot equals current reasoning-engine integration
    common_verbs:
      - check
      - save
      - compare
      - stop
      - ask
      - return
      - run
      - trace
    term_budget:
      max_new_reasoning_engine_terms_per_section: 2
      define_on_first_use: true
      reuse_only_when_it_shortens_the_explanation: true
      applies_to: explanatory_prose
      excludes:
        - familiar orchestrator terms used with their existing meaning
        - exact literals in reference tables
        - code names
        - paths
        - commands
    replace_in_reader_facing_prose:
      - avoid: reduces
        prefer: checks and returns
      - avoid: finite
        prefer: a complete list supplied for this run
      - avoid: frozen
        prefer: fixed for this run
      - avoid: typed advice
        prefer: a named result with a fixed structure
      - avoid: runtime path
        prefer: the order the code follows
      - avoid: bounded slice
        prefer: small implemented part with a deliberately limited job
      - avoid: posture
        prefer: current status
      - avoid: material
        prefer: important enough to change the result
      - avoid: discriminator
        prefer: detail that tells the options apart
      - avoid: non-dominated
        prefer: not outranked by another route
      - avoid: admitted observation
        prefer: observation accepted as input for this run
      - avoid: synchronization drift
        prefer: documents disagree about the current state
      - avoid: candidate architecture
        prefer: proposed design that is not fully implemented
    familiar_orchestrator_terms_no_basic_definition_needed:
      - ACI
      - APT
      - append-only ledger
      - capability
      - confirmation
      - digest
      - dispatch
      - fail-closed
      - idempotency
      - projection
      - SWU
    engine_specific_terms_explain_before_reuse:
      - snapshot
      - catalog
      - semantic outcome
      - reasoning receipt
      - effect gate
      - canonical bytes
      - defeater
      - revalidation
      - claim ceiling
      - L0
    shared_terms_require_local_qualifier:
      - authority
      - gate
      - receipt
      - replay
      - snapshot
    preserve_exact_code_language:
      functions:
        - executeWitness
        - evaluateSemanticJudgment
        - resolveIntentRoute
      evaluator_outcomes:
        - InvalidInput
        - UnauthorizedCatalog
        - OutOfDomain
        - Ineligible.Defeated
        - Deferred.Insufficient
        - EscalateOwner
        - RecommendedUnderSnapshot
        - Invalidated
      resolver_results:
        - candidate
        - ambiguous
        - no-match
        - invalid
      exact_boundary_literal: "authority_effect: none"
      also_preserve:
        - paths
        - commands
        - package IDs
        - property names

  transport_schema:
    name: adjacent_project_onboarding_guide
    format: markdown
    length_words:
      min: 1300
      max: 2200
    max_characters: 18000
    opening_contract:
      job: >
        Start from the orchestrator boundary the reader already knows, use one
        concrete governed research dispatch to expose the different semantic
        decision this engine explores, then state what works today and the
        advice-versus-permission limit.
      validation_rules:
        first_paragraph_cannot_match:
          - '(?i)^\s*the agent reasoning engine is a private, pre-action design'
          - '(?i)^\s*this guide (aims|will|is intended)'
          - '(?i)^\s*ACI stands for'
        first_paragraph_must_include_any:
          - orchestrator
          - different decision
          - advice is not permission
        draft_must_include_anywhere:
          - Advice is not permission.
          - cyberalchemy-orchestrator
          - executeWitness
          - resolveIntentRoute
          - "authority_effect: none"
          - not currently integrated
      external_reference_policy:
        external_reference_terms:
          - CAV2
          - DomainSpec
          - Arcanum
        allowed_after_paragraph: 4
      familiar_reference_policy:
        may_appear_in_opening:
          - cyberalchemy-orchestrator
          - ACI
          - dispatch
          - launch authorization
          - gate
          - receipt
          - digest
        rule: familiar terms may open the bridge but must be qualified when their engine meaning differs
    section_contract:
      section_count:
        min: 8
        max: 11
      every_section_has_one_reader_question: true
      reference_tables_come_after_plain_explanations: true
      code_names_follow_behavior_explanations: true
      every_cross_project_analogy_names_similarity_and_difference: true
    ending_contract:
      job: >
        Ask the reader to retell the two flows, state what is unfinished, and
        identify the safe next action.
      no_new_vocabulary: true
      no_promotional_call_to_action: true

  distill_trace:
    seed_point: replace_generic_request_with_governed_research_dispatch
    target_context: one_cross_project_onboarding_document_for_an_adjacent_system_expert
    output_artifact: standalone_yaml_composition_contract
    optimization_goal: use_familiar_architecture_without_implying_shared_semantics_or_integration
    mode: standard
    mode_selection: assumed_default_then_confirmed_by_revised_voice_approval
    proposal_tracks: 2
    recursive_round_budget: 2
    proposer_claim: >
      Use a governed investigation of whether ACI journal facts can inform
      reasoning without creating a second lifecycle writer. Preserve the
      confirmation gate and research evidence lifecycle, then show that closed
      findings still require separate owner admission before semantic judgment.
    balancer_objection:
      category: analogy_integrity_and_audience_over_assumption
      concern: >
        Authorship does not prove recall of every current orchestrator detail,
        and shared words such as gate, receipt, snapshot, replay, and authority
        do not establish shared schemas, owners, or runtime integration.
    reconciliation: >
      Reuse the source-supported research-dispatch lifecycle, label it as an
      example rather than an active run, keep Inventory non-authoritative, and
      place a visible no-current-edge boundary before reasoning input.
    smallest_coherent_unit: research_dispatch_to_reasoning_boundary_path
    recomposition_proof: >
      The opening grounds the boundary in a realistic research dispatch; the
      middle introduces the new semantic responsibilities and package behavior;
      the ending tests whether the reader can distinguish governed findings,
      semantic advice, and permission to act.
    frame_expiry: >
      Refresh this schema when another package becomes implemented, the two
      packages become integrated, tests or commands change, the planning
      disagreement is resolved, the lifecycle owner changes the selected next
      task, or the user corrects the assumed orchestrator familiarity.

  composition_plan:
    source_candidate_set: research_dispatch_bridge_approved_v3
    selected_unit: research_dispatch_to_reasoning_boundary_path
    construction_sequence:
      - research_dispatch_bridge
      - current_truth
      - semantic_gap_and_refund_story
      - evaluator
      - resolver
      - aci_boundary
      - project_map
      - first_ninety_minutes
      - first_contribution
      - reference_and_readiness
    parts:
      - part_id: research_dispatch_bridge
        reader_question: Where does this engine begin after the orchestrator ends?
        job: Use one governed research dispatch to introduce the separate semantic-judgment boundary.
        must_include:
          - the question asks whether reasoning can use ACI-owned journal facts without becoming a second lifecycle writer
          - a dispatch trigger and read-only Inventory map precede planning
          - a validated sheet and two independent challenge passes precede explicit human confirmation
          - registration and agent work happen only after confirmation
          - research proceeds through explorers, synthesis, review, evidence closure, writer, auditor, and closeout
          - research.md holds verbatim explorer returns and findings.md follows evidence closure
          - closed findings are evidence rather than authority or automatic reasoning input
          - this engine evaluates what follows from fixed facts and rules
          - two small parts work today
          - the complete engine does not
          - Advice is not permission.
        must_not_include:
          - outcome lists
          - lifecycle IDs
          - a basic tutorial on ACI, gates, receipts, digests, or SWUs
          - any claim that the projects are integrated
          - a claim that this example is a registered or active dispatch
          - an arrow from findings.md to a reasoning snapshot
        analogy:
          similarity: both bind inputs, preserve explicit gates, and fail closed
          difference: research produces governed evidence while the engine derives a semantic result from owner-admitted fixed inputs
          forbidden_inference: closed findings do not become true, enter the engine automatically, or permit an effect
        max_new_reasoning_engine_terms: 2

      - part_id: current_truth
        reader_question: What works today?
        job: Separate implemented, proposed, blocked, and absent behavior.
        presentation: four_row_plain_language_table
        must_include:
          - the sibling orchestrator contains an opt-in ACI and APT local pilot
          - semantic judgment evaluator works as a local library
          - intent route resolver works as a local library
          - they are siblings and are not wired together
          - no reasoning-engine service, orchestrator integration, real effect, release, or deployment
        max_new_reasoning_engine_terms: 2

      - part_id: semantic_gap_and_refund_story
        reader_question: What decision remains after orchestration is correct?
        job: Show why governing a dispatch does not decide whether its domain conclusion is justified.
        example: refund_review
        teaching_order:
          - orchestrator may authorize and record a well-bound run
          - domain conclusion still needs a separate semantic evaluation
          - fixed facts and rules
          - recommendation
          - separate permission check
          - no real refund action
          - introduce snapshot and gate
        analogy:
          similarity: both bind one decision to exact inputs
          difference: the evaluator derives a semantic outcome rather than authorizing an agent launch
          forbidden_inference: valid orchestration proves the refund conclusion
        max_new_reasoning_engine_terms: 2

      - part_id: evaluator
        reader_question: How does the evaluator work?
        job: Explain the order of checks before showing exact function names.
        teaching_order:
          - check whether review may start
          - save that decision
          - check fixed facts and rules
          - save why the answer was reached
          - stop unless the answer is a recommendation
          - run a separate permission check for one exact test action
          - introduce executeWitness
        cross_project_contrast:
          - evaluator entry gate is not the mandatory host launch gate
          - reasoning receipt is not an ACI orchestration lifecycle receipt
          - RecommendedUnderSnapshot is not status=launch-authorized
        required_reference:
          - eight exact outcome literals in a compact table
          - evaluator file map after the walkthrough
        max_new_reasoning_engine_terms: 2

      - part_id: resolver
        reader_question: How does the route resolver differ?
        job: Explain how it compares a prepared request with a fixed route list.
        teaching_order:
          - validate the request and route list
          - remove routes that do not fit
          - ask one question when an important detail is missing
          - if several routes fit, prefer one only when the fixed route list explicitly says it outranks another
          - return candidate, ambiguous, no-match, or invalid
          - introduce resolveIntentRoute
        must_include:
          - it may feel like a deterministic pre-filter but owns a different catalog and result contract
          - it does not understand free-form language by itself
          - it does not discover, dispatch, approve, or execute anything
          - "authority_effect: none"
          - candidate is not a selected agent, confirmed dispatch, or launch authorization
        max_new_reasoning_engine_terms: 2

      - part_id: aci_boundary
        reader_question: How could this relate to ACI without taking over ACI authority?
        job: Show the proposed ACI-subordinate seam and the current absence of integration.
        presentation: owned_existing_designed_absent_boundary_map
        must_include:
          - orchestrator ACI already owns its own Session, journal, capability, and dispatch lifecycle contracts
          - the reasoning-engine design keeps semantic derivation and reasoning-receipt content separate
          - most surrounding components remain design or blocked plan
          - resolver output is not currently wired into evaluator input
          - orchestrator ACI is a future integration dependency, not current compatibility evidence
        must_not_include:
          - a direct implemented arrow between the projects
          - a claim that matching vocabulary proves conformance
        max_new_reasoning_engine_terms: 2

      - part_id: project_map
        reader_question: Which files should I trust for which question?
        job: Separate design documents, current planning state, source code, tests, and historical evidence.
        presentation:
          - compact_directory_map
          - question_to_source_table
        must_include:
          - development versus implementation directories
          - cyberalchemy-orchestrator is a comparison source and future dependency, not reasoning-engine authority
          - lifecycle ledger and work-pack disagreement
          - historical files may preserve older status wording
        max_new_reasoning_engine_terms: 2

      - part_id: first_ninety_minutes
        reader_question: What can I do right now?
        job: Provide a runnable path that creates no project mutation.
        steps:
          - run both complete test suites
          - trace the refund fixture
          - trace one resolver witness case
          - compare dispatch launch authorization, semantic recommendation, and effect permission
          - locate the proposed ACI seam in design documents without assuming runtime integration
        must_include:
          - exact commands
          - no dependency installation is normally required
          - the packages are libraries, not services
          - skip basic orchestration setup and focus on engine-specific code and contracts
        max_new_reasoning_engine_terms: 1

      - part_id: first_contribution
        reader_question: When is it safe to edit code?
        job: Explain the current boundary without turning the section into a governance manual.
        plain_rule: >
          Apply the same admission discipline used for governed dispatch:
          reading and tests are available now, while editing needs one selected
          task, an agreed file boundary, and a named review check.
        must_include:
          - current documents disagree about what happens next
          - green tests do not select the next task
          - do not redefine SWU; explain only this project's current SWU selection state
          - do not edit generated receipts by hand
        max_new_reasoning_engine_terms: 1

      - part_id: reference_and_readiness
        reader_question: Am I ready to join a scoped task?
        job: Put exact terms and the comprehension check at the end.
        contents:
          - compact engine-specific glossary
          - same_word_different_job comparison table
          - common newcomer mistakes
          - five retell questions
        ending_test: reader_can_answer_in_their_own_words
        max_new_reasoning_engine_terms: 0

  surface_map:
    audience_facing:
      - orchestrator-to-reasoning boundary comparisons
      - concrete examples
      - exact commands
      - code names after explanations
      - status and safety limits
    reference_only:
      - outcome literals
      - resolver result literals
      - acronyms
      - source paths
      - exact cross-project contract names
    authoring_only_do_not_copy_into_guide:
      - SCU cores
      - Distill trace
      - transport proof status
      - schema validation metadata
      - Whisper lifecycle labels

  claim_ceiling:
    audience_context:
      supported: the user states that the teammate made cyberalchemy-orchestrator
      not_supported: repository-derived proof of authorship or complete current recall
    supported:
      - two private local library packages have current executable tests
      - each package has a bounded behavior that can be traced from fixtures
      - both return advice without product authority
      - the larger engine remains proposed and blocked
      - cyberalchemy-orchestrator contains separate ACI and APT runtime work that can provide a familiar comparison surface
    prohibited:
      - the whole Agent Reasoning Engine is implemented
      - the resolver and evaluator form a current end-to-end runtime
      - cyberalchemy-orchestrator is the Agent Reasoning Engine
      - existing orchestrator ACI proves reasoning-engine integration or conformance
      - similar names imply identical schemas, owners, authority, or lifecycle
      - authorship implies recall of every current orchestrator subsystem
      - either result grants permission to act
      - tests prove external facts, ownership, integration, release, or deployment
      - the next implementation task is selected or authorized
      - private CAV2 material is public Arcanum content

  readability_dynamics:
    layer_id: adjacent_project_onboarding_readability_v2
    defaults:
      severity_default: flag
      max_words_per_paragraph: 70
      max_sentences_per_paragraph: 4
      max_consecutive_dense_paragraphs: 1
      require_scan_anchor_every_n_blocks: 3
    density_profile:
      abstraction_terms:
        - snapshot
        - catalog
        - semantic outcome
        - reasoning receipt
        - effect gate
        - revalidation
        - L0
      example_markers:
        - for example
        - imagine
        - in practice
        - this means
        - in the code
        - start with
        - in the orchestrator
        - unlike
        - the difference is
    scan_anchors:
      terms:
        - for example
        - in practice
        - this means
        - start here
        - in the code
        - in the orchestrator
        - unlike
        - the difference is
        - what works today
        - try it
    delivery_flow:
      intent_narration_patterns:
        - '(?i)\bthis guide (aims|will|is intended)\b'
        - '(?i)\bthe purpose of this section is\b'
      detect_exact_duplicate_prose_blocks: true
      duplicate_block_min_words: 10
      human_review_checks:
        - each heading answers a different reader question
        - familiar orchestrator pattern appears before the engine-specific difference and term
        - every analogy states similarity, difference, and forbidden inference
        - repeated safety lines add context instead of repeating mechanically
        - diagrams can be retold as sentences
    validation_rules:
      density_limit_violation: flag
      sentence_density_violation: flag
      scan_anchor_gap: flag
      abstraction_without_example: flag
      intent_narration_detected: flag
      duplicate_prose_block: flag

  draft_artifact:
    target_path: BEGINNER-GUIDE.md
    source_schema: BEGINNER-GUIDE-SCHEMA.yml
    current_mutation_state: rewritten_against_v0.3
    next_mutation_state: teammate_comprehension_review
    generated_or_authoritative: false

  validation:
    review_mode: human_gate_plus_deterministic_checks
    schema_checks:
      - YAML parses as one mapping.
      - All required Whisper field families are present.
      - Every composition part has one reader question and one job.
      - All referenced local source paths exist at rewrite time.
      - User-supplied authorship is labeled separately from repository-derived audience evidence.
      - Current-state claims, commands, and test expectations are refreshed before rewriting.
    draft_checks:
      - Whisper draft validator passes or returns only reviewed readability flags.
      - The opening follows the revised audition after operator approval.
      - Reader-facing prose follows the jargon replacement table.
      - Familiar orchestrator concepts are not explained as beginner vocabulary.
      - Every cross-project analogy states both the transferable pattern and the different contract or owner.
      - Every local Markdown link and anchor resolves.
      - Both package test commands remain exact and runnable.
      - No paragraph implies whole-engine, integration, release, or action authority.
      - The research-dispatch example preserves confirmation before registration and the exact research role order.
      - Inventory is discovery only; research outputs remain evidence with no current edge to reasoning input.
      - Whitespace and final-newline checks pass for the changed guide.
    human_comprehension_questions:
      - Why does a closed research dispatch not make findings true or feed the reasoning engine automatically?
      - Which decision does the reasoning engine address that governed dispatch does not?
      - How do launch authorization, semantic recommendation, and effect permission differ?
      - What does each package return?
      - Which ACI patterns are useful analogies, and where does each analogy stop?
      - Why does existing orchestrator ACI not prove current reasoning-engine integration?
    pass_condition: >
      The teammate answers at least four questions accurately in their own
      words, can run and trace one example from each package, and does not draw
      an implemented runtime edge between the projects.
    evidence_boundary: >
      A passing document review supports onboarding clarity only. It does not
      authorize implementation or establish product readiness.

  learning_residue:
    status: pending_teammate_review
    capture_after:
      - first_read
      - first_test_run
      - first_fixture_trace
    residue_slots:
      - first_word_or_section_that_caused_confusion
      - explanation_the_teammate_repeated_successfully
      - missing_example
      - unnecessary_detail
      - stale_source_or_command
      - orchestrator_concept_unnecessarily_reexplained
      - assumed_familiarity_that_was_not_current
      - analogy_that_implied_a_shared_contract
    next_route: revise_schema_or_promote_voice_pattern_after_comprehension_review

  delivery:
    current_result: candidate_onboarding_artifacts_synchronized
    human_gate: teammate_comprehension_pending
    derivative_status:
      BEGINNER-GUIDE.md: rewritten_against_frozen_v0.3_intent
      BEGINNER-GUIDE-SCHEMA.lanes.json: synchronized_to_frozen_v0.3_schema
      BEGINNER-GUIDE-SCHEMA.html: synchronized_to_frozen_v0.3_schema
      active_preview: managed_loopback_evidence_is_external_to_this_schema
    after_acceptance:
      - collect_teammate_comprehension_feedback
      - revise_only_if_the_feedback_changes_the_frozen_intent
      - keep_transport_status_flag_until_teammate_review
    transport_status_until_teammate_review: flag
