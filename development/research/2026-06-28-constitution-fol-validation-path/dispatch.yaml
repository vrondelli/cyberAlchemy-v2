goal: >
  Does first-order-logic (and adjacent formal-methods) validation of the cav2 +
  DomainSpec constitutions add VALIDATED correctness beyond what is already owned
  — the DomainSpec axiom→rule→gate chain (AXIOMS.md + CONSTITUTION.md), the cav2
  invariant/axiom/constitution role model + per-rule closure-validator SPEC, and
  the categorical Lean spine (AgentPermissionKernel, FunctorialResidueStructure) —
  i.e. is FOL-`state ⊨ constitution` a DISTINCT build-worthy path or does it
  COLLAPSE into owned work; and is it a COMPLEMENT to, or a FORK from, the
  categorical `⊨` prize identified by the kodamai-correctness-layer dispatch?
  Deliver a register verdict AND a buildable first step, demonstrated on one real
  cav2 constitution rule.

success_metric:
  type: register-verdict-plus-witness
  target: >
    A verdict on each FOL-validation claim (build-from-owned / novel-residue /
    collapses-to-owned) with owner cited; a register verdict (FOL complement vs
    fork vs categorical-subsumes); a buildable first step (which tool, which
    review-mode rule first, what residue over the closure-validator); and ONE
    concrete witness — a real cav2 rule + sibling formalized in FOL/Alloy/Datalog,
    with an explicit finding on whether it catches a cross-rule defect the
    per-rule validator cannot. Collapse-test binds the headline. claim ≤ proof.

