syntax = "proto3";
package cav2.trusted_dataset.v1;

message DataReference {
  string uri = 1;
  string sha256 = 2;
  string media_type = 3;
  uint64 byte_count = 4;
}

message ExtractRequest { string source_window = 1; }
message ExtractReply { repeated DataReference pages = 1; string proposed_checkpoint = 2; }
message PublishRequest { DataReference staged_dataset = 1; string version_id = 2; }
message PublishReply { DataReference published_dataset = 1; bool effect_applied = 2; }

service SourceConnector { rpc Extract(ExtractRequest) returns (ExtractReply); }
service SinkConnector { rpc Publish(PublishRequest) returns (PublishReply); }
