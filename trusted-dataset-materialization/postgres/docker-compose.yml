services:
  postgres:
    image: postgres@sha256:23e88eb049fd5d54894d70100df61d38a49ed97909263f79d4ff4c30a5d5fca2
    environment:
      POSTGRES_DB: cav2_etl
      POSTGRES_USER: cav2
      POSTGRES_PASSWORD: cav2-local-only
    ports:
      - "127.0.0.1:${CAV2_POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cav2 -d cav2_etl"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
