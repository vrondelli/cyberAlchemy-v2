decisions:
  - decision_id: DEC-CAV2-TOWER-ALTITUDE-001
    scope_id: CTX-CAV2-DEF-TOWERS
    decision_type: selection
    question: Should CyberAlchemy v2 be the umbrella, Arcanum and DomainSpec be pillars, and Craft be an Arcanum-owned execution sub-tower with local priority?
    description: Provisional tower-altitude decision used to map work without promoting new canonical terms.
    options:
      - umbrella-pillars-craft-subtower
      - four-peer-pillars
      - source-family-only-clusters
    default_option: umbrella-pillars-craft-subtower
    selected: umbrella-pillars-craft-subtower
    rationale: Existing CyberAlchemy v2 definitions and source map already treat CyberAlchemy v2 as the stable repository amalgamation, while Arcanum and DomainSpec have distinct owner boundaries. Craft supplies the execution ledger but does not own global semantics.
    evidence: ART-CAV2-DEFINITION-TOWERS
    status: active
    blocking: false
    impact: Lets mapping continue while still requiring definitions-governance before term promotion.
    links:
      - label: Definition towers
        target: ART-CAV2-DEFINITION-TOWERS
        kind: artifact-id
  - decision_id: DEC-CAV2-VISIBLE-SPACES-001
    scope_id: CTX-CAV2-SPACES
    decision_type: blocker
    question: Should CyberAlchemy v2 keep visible inventory/ and ontology/ spaces, or hide them under .arcanum with exported docs before standalone extraction?
    description: Blocking extraction-readiness decision inherited from SOURCE-MAP OQ-1.
    options:
      - keep-visible-project-spaces
      - hide-under-dot-arcanum-with-exports
      - defer-until-extraction
    default_option: keep-visible-project-spaces
    selected: pending
    rationale: Pending owner review; visible spaces are useful while staged, but extraction may need a cleaner public/private boundary.
    evidence: ART-CAV2-SOURCE-MAP
    status: active
    blocking: true
    impact: Blocks standalone extraction and final architecture authority, but not local tower mapping.
  - decision_id: DEC-CAV2-PUBLIC-PRIVATE-001
    scope_id: CTX-CAV2-BOUNDARY
    decision_type: blocker
    question: Which private implementation and validation evidence may influence public or standalone CyberAlchemy v2 artifacts?
    description: Boundary decision required before public derivatives or standalone extraction.
    options:
      - private-evidence-only-in-private-repo
      - public-safe-pattern-cards-after-scrub
      - no-private-derived-public-material
    default_option: public-safe-pattern-cards-after-scrub
    selected: pending
    rationale: Pending owner review; source evidence includes private implementation/domainspec and validation/poker-team.
    evidence: ART-CAV2-SOURCE-MAP
    status: active
    blocking: true
    impact: Blocks public-facing reuse and extraction, but not private local classification.
  - decision_id: DEC-CAV2-DEFINITION-LOCALIZATION-001
    scope_id: CTX-CAV2-DEF-TOWERS
    decision_type: route
    question: Should imported definitions remain external references, or should CyberAlchemy v2 hold project-local representations for all definition material?
    description: "Owner correction for the definition-tower stream: v2 should aim to contain all definitions inside the project space as represented, source-ledgered material."
    options:
      - v2-local-definition-space
      - external-reference-only
      - canonicalize-all-imports
    default_option: v2-local-definition-space
    selected: v2-local-definition-space
    rationale: A local representation layer lets Craft execute search, clustering, dedupe, and promotion routing without silently redefining source-owned Arcanum, DomainSpec, research, or project terms.
    evidence: ART-CAV2-DEF-LOCALIZATION-ROUTE
    status: closed
    blocking: false
    impact: Changes the next definition step from reference-only linking to v2-local source-cluster representation with provenance and authority posture.
  - decision_id: DEC-CAV2-IOLM-POSTURE-001
    scope_id: CTX-CAV2-IOLM
    decision_type: selection
    question: >-
      Should the Interactive Ontology Learning Map preserve the assurance-first route, or adopt a
      code-first candidate graph with later authority rebind?
    description: >-
      The current work-pack blocks all prototype writes until the owner-issued FPR Sg exists. A
      validated proposal-only refresh shows that the tested minted-project runtime can support one
      candidate graph and UI/read-model pipeline now without claiming FPR authority.
    options:
      - assurance-first
      - code-first-candidate-later-authority-rebind
    default_option: code-first-candidate-later-authority-rebind
    selected: code-first-candidate-later-authority-rebind
    rationale: >-
      The operator selected option 1 through Decision Gate on 2026-07-20. This posture enables
      reversible private learning-product evidence now while preserving one normalized pipeline,
      explicit candidate provenance, and the owner-issued FPR gate for later authority rebind.
    evidence: ART-CAV2-IOLM-POSTURE-REFRESH
    status: closed
    blocking: false
    impact: >-
      The apply-approved refresh activates L0C and selects only SWU-IOLM-00C-A.
      GATE-CAV2-IOLM-SG-001 remains mandatory for authoritative labeling/rebind and cannot be
      satisfied by candidate evidence.
    owner: operator plus private-learning-map-product-owner
    links:
      - label: Proposal-only refresh
        target: ART-CAV2-IOLM-POSTURE-REFRESH
        kind: artifact-id
      - label: Proposed patch contract
        target: ART-CAV2-IOLM-POSTURE-PATCH
        kind: artifact-id
      - label: Active work-pack
        target: ART-CAV2-IOLM-WORKPACK
        kind: artifact-id
      - label: Apply-approved refresh receipt
        target: ART-CAV2-IOLM-POSTURE-APPLY
        kind: artifact-id
  - decision_id: DEC-CAV2-IOLM-00C-B-CROSS-FEATURE-001
    scope_id: CTX-CAV2-IOLM
    decision_type: selection
    question: >-
      How should IOLM obtain the cross-feature candidate graph required by SWU-IOLM-00C-B
      without weakening its proof or mutating DomainSpec outside authority?
    description: >-
      The SWU requires a typed edge crossing the CyberAlchemy Method and Craft seed features,
      while compileMintedProject and its regression test intentionally reject all cross-feature
      edges with CROSS_FEATURE_UNSUPPORTED.
    options:
      - route-upstream-cross-feature-support
      - amend-iolm-to-one-minted-feature
      - defer-until-compiler-boundary-changes
    default_option: route-upstream-cross-feature-support
    selected: route-upstream-cross-feature-support
    rationale: The operator selected option 1 on 2026-07-20, preserving the independently testable two-feature criterion and the DomainSpec compiler as conformance authority.
    evidence: ART-CAV2-IOLM-00C-B-DECISION
    status: closed
    blocking: false
    resolved_at: 2026-07-20
    impact: >-
      Blocks 00C-B prototype mutation and 00C-C selection. It does not affect the passing 00C-A
      contract or close GATE-CAV2-IOLM-SG-001.
    owner: operator plus private-learning-map-product-owner and DomainSpec minted-project owner route
    links:
      - label: Decision Gate artifact
        target: ART-CAV2-IOLM-00C-B-DECISION
        kind: artifact-id
      - label: Blocked Task Session receipt
        target: ART-CAV2-IOLM-00C-B-BLOCK-RECEIPT
        kind: artifact-id
      - label: Active IOLM work-pack
        target: ART-CAV2-IOLM-WORKPACK
        kind: artifact-id
      - label: Upstream BTE block receipt
        target: "[repo-root]/projects/domainspec-v2/development/first-production-release/backend-type-test-engine-completeness/work-pack/session-evidence/SWU-BTE-001/execution-receipt.json"
        kind: path

