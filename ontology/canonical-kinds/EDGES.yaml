# Edge definitions. What each verb MEANS.
# What is PERMITTED lives in ALLOWED-EDGES.yaml.

# THE SESSION RULE. A session may only CREATE or UPDATE a file. Nothing else.
#
# A session records what it DID, never what is TRUE. Create and update are ACTS. Everything a
# session might otherwise want to say — this is refuted, these two conflict, this question is
# open — is a CLAIM, and a claim belongs in an artifact, not on a session's arrow. A session
# bears no authority; a verb that let it assert would let it assert without standing.
#
# So the session verbs are `creates` and `updates`, and that is the whole list. `opens-question`,
# `closes-question`, `surfaces-conflict`, `revisits` and `refutes` were struck: each was a claim
# wearing an act's clothes. Nothing is lost — a question lives in an artifact's `## Open Questions`
# section, so opening one IS updating the artifact; a conflict lives on `contradicts` between the
# two artifacts, and the session that noticed it simply `updates` one of them.
#
# INVERSES. An `inverse:` names a READ DIRECTION — the reverse reading of the same arrow — and is
# NOT a separately declarable edge. Only the forward verb is ever written, at the source named in
# ALLOWED-EDGES.yaml. This is why no inverse appears in the permitted set: there is nothing there
# to permit.

verbs:

  derives-from:
    inverse: derives              # a read direction, not a declarable edge
    class: grounding
    means: A draws its intellectual or evidential basis from B.
    originated_by: artifacts only — never a session.

  contradicts:
    inverse: self                 # symmetric
    class: conflict
    means: >
      A and B assert incompatible things. Declared on the artifact, because it is a CLAIM about
      the two artifacts — not an act, and therefore never a session's arrow to draw. The session
      that notices a conflict records it by UPDATING one of the two artifacts.
    originated_by: artifacts only — never a session.
    not_a_morphism: >
      Symmetric, so it does not compose and admits no path algebra. That is what it is not; it
      does NOT make it a non-edge. "Not a morphism" never licensed "not an edge" — the conflict
      class holds real edges that simply do not compose.
    note: >
      For the `ephemeral` Evidence kinds `contradictions` is `tolerated`, which means a conflict
      here is never resolved and never deleted. It is PERMANENT — which is exactly what belongs on
      a graph. On `perennial` kinds a contradiction is a live defect and a to-do, not a durable
      relation.

  creates:
    inverse: created-by           # a read direction, not a declarable edge
    class: provenance
    means: A session produced B as output.
    originated_by: session only.
    note: >
      NOT total, and it cannot be made so. A session file exists only if `close-session` was run,
      so an artifact may legitimately have no session claiming it. Provenance is therefore PARTIAL
      by construction — a fact about how sessions come into being, not a hole to plug. Nothing may
      be inferred from the absence of a `creates` edge.

  updates:
    inverse: updated-by           # a read direction, not a declarable edge
    class: provenance
    means: A session changed B's content after B already existed.
    originated_by: session only.
    note: >
      One edge per (session, artifact) pair — NOT one per edit. A session that revises a file fifty
      times draws one `updates` edge. It is a relation, not an event log; the event log is git.

# ---------------------------------------------------------------------------
# Why two edges are optional in ALLOWED-EDGES
# ---------------------------------------------------------------------------

optionality:

  research -> discovery:
    cardinality: "0..1"
    why: >
      A research dispatched to answer an OPEN QUESTION of a discovery derives from that
      discovery — it framed the problem, named the terms and the alternatives, and the research
      inherits that. Lineage, not mere motivation. But a research may also be dispatched cold,
      motivated by a bare `question`, which is a FIELD and not a node — nothing for an edge to
      point at. Then there is no edge. This is why a research has NO MANDATORY in-edge.
    known_gap: >
      The edge points at the discovery, not at the question. A discovery with five open questions
      cannot say WHICH one a research was sent to answer; that is matched on the text of the
      research's `question` field. Accepted — giving a question its own identity would make it a
      node, which it is not.

  findings -> research:
    cardinality: "0..1"
    why: >
      The findings is the SYNTHESIS of the research, and the research is the AGGREGATE of the
      investigation: the synthesis rests on the aggregate. Optional because a SINGLE-AGENT research
      dispatch (n=1) emits `findings.md` with no `research.md` beside it — there is nothing to
      point at. A review dispatch is NOT the reason: a review emits `review.md` only and is
      forbidden from writing a `findings.md` at all.

# ---------------------------------------------------------------------------
# Forbidden on purpose. Recorded so they are never re-proposed.
# ---------------------------------------------------------------------------

typed_negatives:

  research -> findings:
    scope: the `derives-from` verb only
    why: >
      The inverted arrow. It would have the AGGREGATE rest on the SYNTHESIS — the raw material
      resting on the conclusion drawn from it. Time runs the other way. (This forbids the forward
      verb; it says nothing about reading `findings --derives-from--> research` backwards, which
      is what the `derives` inverse names.)

  "* -> session":
    why: >
      No artifact grounds itself in a session. A session is a record of work, not evidence for a
      claim. What the session PRODUCED is the evidence, and it is reached by reading `creates`
      backwards — a read direction, not a declarable edge.

  "session -> * (anything but creates / updates)":
    why: >
      THE SESSION RULE (top of file). A session performs acts, never claims. `refutes`,
      `surfaces-conflict`, `opens-question`, `closes-question` and `revisits` were all struck under
      it: each let a session — which bears no authority — assert something. `consumes` (reading is
      not doing) and `continues-from` (the thread of the work, neither act nor claim) are struck by
      the same rule.

  question:
    why: >
      A `question` is a FIELD on an artifact, never a node. Nothing points at it and it points at
      nothing. This is why a research motivated by a bare question has no in-edge — there is no
      node there to be its source.

  discovery -> findings:
    status: UNEXAMINED — flagged, not defended. Raise it before building on it.
    why: >
      A discovery rests on the research (the raw aggregate) but not on the findings (the verdict).
      That is what is settled, and read backwards it looks wrong. It sits here because absence is
      denial and this IS currently denied — but it is the one entry in this section that has not
      earned its place.

# ---------------------------------------------------------------------------
# Unruled — neither permitted nor struck, therefore currently denied.
# ---------------------------------------------------------------------------

unruled:

  derives-from (discovery -> discovery):
    pair: discovery -> discovery
    means: A discovery draws its basis from an earlier discovery.
    why_hard: >
      In the normal spiral D1 -> R1 -> F1 -> D2 the grounding ALREADY exists as a composed path
      (D2 derives-from R1, R1 derives-from D1), so a direct arrow adds nothing and, drawn as well,
      asserts the same grounding by two distinct paths. It serves only the case of a discovery
      refining another with NO research between them, and no such instance exists in the repo to
      force it.
    flips_when: a discovery refines another with no research between them.
    route: ontology route to propose.

  alternative-to:
    pair: discovery <-> discovery
    means: Two discoveries are alternative framings of the same terrain; neither refutes the other.
    why_hard: >
      The right shape, but nothing forces it — unlike `contradicts`, no artifact is left unable to
      record something real without it, and no instance demands it. Vocabulary without a use.
    flips_when: an artifact needs to say "not wrong, just other" and `contradicts` overstates it.
    route: ontology route to propose.

# ---------------------------------------------------------------------------
# Constraint on the FILLED graph. Cannot be enforced by deleting arrows — it varies
# per document, not per kind.
# ---------------------------------------------------------------------------

instance_constraints:

  acyclic-grounding:
    rule: No artifact derives from itself, directly or through a path.
    status: UNENFORCED
    why: >
      The TYPE graph legitimately cycles: discovery -> research -> discovery. At the instance
      level the normal flow is a spiral, not a loop: D1 -> R1 -> F1 -> D2, with D2 != D1. But
      nothing prevents the loop. An `ephemeral` artifact is NOT frozen — D1 can be edited after
      R1 exists. If someone then adds D1 --derives-from--> R1 while R1 --derives-from--> D1
      already holds, each rests on the other and grounding becomes circular. Needs a check.
      `contradicts` is exempt: symmetric by construction, it is not a grounding relation and its
      cycles carry no weight.
