# Allowed edges. Anything not listed here is FORBIDDEN.
# Verb definitions live in EDGES.yaml.
# Scope: the four Evidence kinds. Every other kind is deferred.
#
# The number says HOW MANY of that edge ONE source artifact may declare:
#   0..1   at most one, and it may have none
#   0..N   any number, and it may have none
#   1      exactly one — REQUIRED
# (No edge below is required yet.)
#
# Only FORWARD verbs appear here. An inverse (`derives`, `created-by`, `updated-by`) is a read
# direction, not a declarable edge — there is nothing to permit.
#
# THE SESSION RULE: a session may only CREATE or UPDATE a file. Acts, never claims. See EDGES.yaml.

discovery:
  research:
    derives-from: 0..N        # a discovery may rest on several researches, or on none
                              # (reconnaissance: no research behind it)
  discovery:
    contradicts: 0..N         # symmetric. Two discoveries asserting incompatible things.
                              # The CLAIM lives here, between the artifacts — never on a session's
                              # arrow. A session that notices a conflict `updates` one of them.
                              # `derives-from` and `alternative-to` between two discoveries are
                              # UNRULED (see EDGES.yaml), and therefore denied.

research:
  discovery:
    derives-from: 0..1        # born from one discovery's open question, or dispatched cold

findings:
  research:
    derives-from: 0..1        # normally one; a single-agent (n=1) research dispatch emits
                              # findings.md with no research.md to point at

session:
  discovery:
    creates: 0..N
    updates: 0..N
  research:
    creates: 0..N
    updates: 0..N
  findings:
    creates: 0..N
    updates: 0..N
  session:
    creates: 0..N
    updates: 0..N
  # And nothing else. A session asserts nothing: no `refutes`, no `surfaces-conflict`,
  # no `opens-question`, no `closes-question`, no `revisits`, no `consumes`, no `continues-from`.
  # `creates` is NOT total — a session file exists only if `close-session` was run, so an artifact
  # may legitimately have no session claiming it. Provenance is partial by construction.
