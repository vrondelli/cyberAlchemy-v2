[package]
name = "essays-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
essays-agent-runtime = { path = "/home/vrondelli/projects/domainspec-core/cyberAlchemy-v2/essays/development/agent-runtime/implementation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }

[workspace]
