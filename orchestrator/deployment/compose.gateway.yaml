services:
  orchestrator:
    environment:
      ARE_GATEWAY_SOCKET: /run/are/gateway.sock
      ARE_GATEWAY_PROFILE_REF: "${ARE_GATEWAY_PROFILE_REF:?set an admitted Gateway profile reference}"
    volumes:
      - are_gateway_runtime:/run/are:ro

volumes:
  are_gateway_runtime:
    external: true
    name: "${ARE_GATEWAY_RUNTIME_VOLUME:-cyberalchemy_are_gateway_runtime}"
