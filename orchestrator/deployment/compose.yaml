services:
  orchestrator:
    build:
      context: ../..
      dockerfile: orchestrator/deployment/Dockerfile
    image: "cyberalchemy-orchestrator:${IMAGE_TAG:-candidate}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    ports: ["127.0.0.1:${ORCHESTRATOR_PORT:-8787}:8787"]
    environment:
      ORCHESTRATOR_MAX_ASSIGNMENTS: "${ORCHESTRATOR_MAX_ASSIGNMENTS:-8}"
      ORCHESTRATOR_TEMPLATE_CATALOG: "/opt/orchestrator/examples"
    volumes:
      - orchestrator_state:/var/lib/orchestrator

volumes:
  orchestrator_state:
