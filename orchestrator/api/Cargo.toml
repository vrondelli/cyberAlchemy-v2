[package]
name = "cyberalchemy-orchestrator-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
orchestrator-capabilities = { path = "../capabilities/orchestration" }
cyberalchemy-orchestrator-runtime = { path = "../runtime" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.8", features = ["fs", "trace"] }

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"
rwo-core = { path = "../rwo" }

[lints.rust]
unsafe_code = "forbid"
