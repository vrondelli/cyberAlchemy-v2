name: keld-sandbox
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
x-are-runtime: &are-runtime
  user: "65532:65532"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true, "seccomp=../are-documentation/deploy/seccomp-node.json"]
  pids_limit: 64
  mem_limit: 384m
  cpus: 1.0
  restart: unless-stopped
  tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
  logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
x-app: &app
  image: keld-sandbox:${KELD_VERSION:-candidate}
  build: {context: .bundle, dockerfile: Dockerfile}
  user: "10001:10001"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 768m
  restart: unless-stopped
  stop_grace_period: 135s
  logging: *logging
  networks: [backend, egress]
  tmpfs: ["/tmp:size=16m,mode=1777", "/scratch:size=600m,mode=1777"]
  volumes:
    - ./.runtime/keld.json:/config/keld.json:ro
    - ./.runtime/commerce:/data
    - ./.runtime/artifacts:/artifacts:ro
x-payments: &payments
  KELD_STRIPE_SECRET_FILE: /run/secrets/stripe
  KELD_MP_TOKEN_FILE: /run/secrets/mercadopago
  KELD_PAYPAL_CLIENT_ID_FILE: /run/secrets/paypal_client_id
  KELD_PAYPAL_SECRET_FILE: /run/secrets/paypal_secret
services:
  edge:
    image: keld-caddy:2.11.4-security-plan-20260920-r2
    build: {context: ., dockerfile: Caddy.Dockerfile}
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      KELD_DOMAIN: ${KELD_DOMAIN:?set KELD_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN}
      ARE_DOMAIN: ${ARE_DOMAIN:?set ARE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, egress, are-edge]
    logging: *logging
    depends_on:
      web: {condition: service_healthy}
      are-edge: {condition: service_started}
  postgres:
    image: keld-postgres:16-security-candidate
    build: {context: ., dockerfile: Postgres.Dockerfile}
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    volumes:
      - ./.runtime/postgres:/var/lib/postgresql/data
      - ./.runtime/init-databases.sql:/docker-entrypoint-initdb.d/10-keld.sql:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/run/postgresql:size=16m,uid=70,gid=70,mode=3775
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    logging: *logging
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    entrypoint: ["/bin/bash", "/opt/keld-entrypoint.sh"]
    user: "1000:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://${AUTH_DOMAIN:?set AUTH_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: keld-admin
      KC_HEALTH_ENABLED: "true"
    secrets: [keycloak_db_password, keycloak_admin_password]
    volumes:
      - ./keycloak-entrypoint.sh:/opt/keld-entrypoint.sh:ro
      - ./.runtime/keld-realm.json:/opt/keycloak/data/import/keld-realm.json:ro
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend, egress]
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 3s
      retries: 18
  web:
    <<: *app
    environment:
      <<: *payments
      KELD_OIDC_SECRET_FILE: /run/secrets/oidc
      KELD_DATABASE_URL_FILE: /run/secrets/session_database_url
      KELD_SESSION_KEY_FILE: /run/secrets/session_key
      KELD_STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook
      KELD_MP_WEBHOOK_SECRET_FILE: /run/secrets/mp_webhook
    secrets: [stripe, mercadopago, paypal_client_id, paypal_secret, oidc, session_database_url, session_key, stripe_webhook, mp_webhook]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
  worker:
    <<: *app
    command: ["node", "bin/maintain.mjs", "/config/keld.json", "watch", "60"]
    environment: *payments
    secrets: [stripe, mercadopago, paypal_client_id, paypal_secret]
    depends_on:
      web: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{const h=JSON.parse(fs.readFileSync('/scratch/worker-health.json','utf8'));process.exit(h.schema==='keld-worker-health/v1'&&h.healthy===true&&Date.now()/1000-h.observedAt<180?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 3s
      retries: 6
      start_period: 90s
  are-production-inputs:
    image: keld-sandbox:${KELD_VERSION:-candidate}
    build: {context: .bundle, dockerfile: Dockerfile}
    command: ["node", "/opt/keld/verify-production-inputs.mjs"]
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    restart: "no"
    environment:
      ARE_EDGE_IMAGE: "${ARE_EDGE_IMAGE:?set ARE_EDGE_IMAGE to a digest-pinned ARE edge image reference}"
      ARE_PUBLIC_CHAT_IMAGE: "${ARE_PUBLIC_CHAT_IMAGE:?set ARE_PUBLIC_CHAT_IMAGE to a digest-pinned ARE public-chat image reference}"
      ARE_INFERENCE_BROKER_IMAGE: "${ARE_INFERENCE_BROKER_IMAGE:?set ARE_INFERENCE_BROKER_IMAGE to a digest-pinned ARE broker image reference}"
      ARE_PROVIDER_GATEWAY_IMAGE: "${ARE_PROVIDER_GATEWAY_IMAGE:?set ARE_PROVIDER_GATEWAY_IMAGE to a digest-pinned ARE provider-gateway image reference}"
      ARE_CHAT_IDLE_RETENTION_SECONDS: "${ARE_CHAT_IDLE_RETENTION_SECONDS:?set the owner-approved idle retention in seconds}"
      ARE_BROKER_HOURLY_MICROUSD_LIMIT: "${ARE_BROKER_HOURLY_MICROUSD_LIMIT:?set the owner-approved hourly micro-USD ceiling}"
      ARE_BROKER_MONTHLY_MICROUSD_LIMIT: "${ARE_BROKER_MONTHLY_MICROUSD_LIMIT:?set the owner-approved monthly micro-USD ceiling}"
      ARE_PROVIDER_INPUT_MICROUSD_PER_MILLION_TOKENS: "${ARE_PROVIDER_INPUT_MICROUSD_PER_MILLION_TOKENS:?set the provider input rate in micro-USD per million tokens}"
      ARE_PROVIDER_OUTPUT_MICROUSD_PER_MILLION_TOKENS: "${ARE_PROVIDER_OUTPUT_MICROUSD_PER_MILLION_TOKENS:?set the provider output rate in micro-USD per million tokens}"
    volumes:
      - ./verify-production-inputs.mjs:/opt/keld/verify-production-inputs.mjs:ro
    logging: *logging
  are-edge:
    <<: *are-runtime
    image: "${ARE_EDGE_IMAGE:?set ARE_EDGE_IMAGE to a digest-pinned ARE edge image reference}"
    environment:
      ARE_CHAT_ACCESS_MODE: "anonymous-public"
      ARE_CHAT_PUBLIC_HOST: "${ARE_DOMAIN:?set ARE_DOMAIN}"
    networks: [are-edge, are-chat-ingress]
    depends_on:
      are-production-inputs: {condition: service_completed_successfully}
      are-public-chat: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  are-public-chat:
    <<: *are-runtime
    image: "${ARE_PUBLIC_CHAT_IMAGE:?set ARE_PUBLIC_CHAT_IMAGE to a digest-pinned ARE public-chat image reference}"
    environment:
      ARE_CHAT_PUBLIC_ORIGIN: "https://${ARE_DOMAIN:?set ARE_DOMAIN}"
      ARE_CHAT_IDLE_RETENTION_SECONDS: "${ARE_CHAT_IDLE_RETENTION_SECONDS:?set the owner-approved idle retention in seconds}"
    networks:
      are-chat-ingress:
        aliases: [public-chat]
      are-inference: {}
    depends_on:
      are-production-inputs: {condition: service_completed_successfully}
      are-inference-broker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4193/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  are-inference-broker:
    <<: *are-runtime
    image: "${ARE_INFERENCE_BROKER_IMAGE:?set ARE_INFERENCE_BROKER_IMAGE to a digest-pinned ARE broker image reference}"
    environment:
      ARE_BROKER_HOURLY_MICROUSD_LIMIT: "${ARE_BROKER_HOURLY_MICROUSD_LIMIT:?set the owner-approved hourly micro-USD ceiling}"
      ARE_BROKER_MONTHLY_MICROUSD_LIMIT: "${ARE_BROKER_MONTHLY_MICROUSD_LIMIT:?set the owner-approved monthly micro-USD ceiling}"
      ARE_PROVIDER_INPUT_MICROUSD_PER_MILLION_TOKENS: "${ARE_PROVIDER_INPUT_MICROUSD_PER_MILLION_TOKENS:?set the provider input rate in micro-USD per million tokens}"
      ARE_PROVIDER_OUTPUT_MICROUSD_PER_MILLION_TOKENS: "${ARE_PROVIDER_OUTPUT_MICROUSD_PER_MILLION_TOKENS:?set the provider output rate in micro-USD per million tokens}"
    volumes: ["are-broker-quota:/var/lib/are-broker-quota"]
    networks:
      are-inference:
        aliases: [inference-broker]
      are-provider-link: {}
    depends_on:
      are-production-inputs: {condition: service_completed_successfully}
      are-provider-gateway: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4194/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  are-provider-gateway:
    <<: *are-runtime
    image: "${ARE_PROVIDER_GATEWAY_IMAGE:?set ARE_PROVIDER_GATEWAY_IMAGE to a digest-pinned ARE provider-gateway image reference}"
    secrets:
      - source: are_model_api_key
        target: model_api_key
        uid: "65532"
        gid: "65532"
        mode: 0400
    networks:
      are-provider-link:
        aliases: [provider-gateway]
      are-provider-egress: {}
    depends_on:
      are-production-inputs: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:4195/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
secrets:
  stripe: {file: ./.runtime/secrets/stripe}
  mercadopago: {file: ./.runtime/secrets/mercadopago}
  paypal_client_id: {file: ./.runtime/secrets/paypal_client_id}
  paypal_secret: {file: ./.runtime/secrets/paypal_secret}
  oidc: {file: ./.runtime/secrets/oidc}
  session_database_url: {file: ./.runtime/secrets/session_database_url}
  session_key: {file: ./.runtime/secrets/session_key}
  stripe_webhook: {file: ./.runtime/secrets/stripe_webhook}
  mp_webhook: {file: ./.runtime/secrets/mp_webhook}
  postgres_admin_password: {file: ./.runtime/secrets/postgres_admin_password}
  keycloak_db_password: {file: ./.runtime/secrets/keycloak_db_password}
  keld_db_password: {file: ./.runtime/secrets/keld_db_password}
  keycloak_admin_password: {file: ./.runtime/secrets/keycloak_admin_password}
  are_model_api_key: {file: ./.runtime/secrets/are_model_api_key}
networks:
  backend: {internal: true}
  egress: {}
  are-edge: {internal: true}
  are-chat-ingress: {internal: true}
  are-inference: {internal: true}
  are-provider-link: {internal: true}
  are-provider-egress: {}
volumes:
  caddy_data: {}
  caddy_config: {}
  are-broker-quota: {}
