<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="artifactTitle artifactDesc">
<title id="artifactTitle">The Keld maker's mark, imagined as a precision instrument</title>
<desc id="artifactDesc">An exploded hexagonal assembly with a copper core, dark metal panels and fine technical annotations. An artistic brand study, not a product rendering.</desc>
<defs>
  <linearGradient id="metalFace" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#5d6158"/><stop offset=".2" stop-color="#31362f"/><stop offset=".58" stop-color="#1f2520"/><stop offset="1" stop-color="#101613"/></linearGradient>
  <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#99998a"/><stop offset=".2" stop-color="#505549"/><stop offset=".5" stop-color="#181e19"/><stop offset=".8" stop-color="#6a6857"/><stop offset="1" stop-color="#31372c"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3d1a1"/><stop offset=".26" stop-color="#a36c42"/><stop offset=".5" stop-color="#d2a277"/><stop offset=".74" stop-color="#694630"/><stop offset="1" stop-color="#c79562"/></linearGradient>
  <linearGradient id="copperDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#956841"/><stop offset="1" stop-color="#32251c"/></linearGradient>
  <linearGradient id="coreFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3aa7b"/><stop offset=".22" stop-color="#8f6c47"/><stop offset=".65" stop-color="#3c392a"/><stop offset="1" stop-color="#826041"/></linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0e1310"/><stop offset=".5" stop-color="#262f26"/><stop offset="1" stop-color="#101611"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#c28c4b" stop-opacity=".24"/><stop offset=".46" stop-color="#697341" stop-opacity=".1"/><stop offset="1" stop-color="#16221b" stop-opacity="0"/></radialGradient>
  <radialGradient id="ground"><stop stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0v48" fill="none" stroke="#b5bf9b" stroke-opacity=".06" stroke-width=".7"/></pattern>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v5" stroke="#d8d8bb" stroke-opacity=".06" stroke-width=".7"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="20" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
