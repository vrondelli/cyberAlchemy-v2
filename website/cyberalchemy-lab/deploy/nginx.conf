server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /en { return 308 /en/; }
    location = /en/ { try_files /en/index.html =404; }
    location = /en/index.html { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location / { return 404; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
