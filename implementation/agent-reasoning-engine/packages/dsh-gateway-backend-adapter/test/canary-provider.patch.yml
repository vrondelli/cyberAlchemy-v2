- id: agent-default-model
  config:
    provider: are-canary
    model: fixture-model
- id: llm-pi-ai
  config:
    providers:
      are-canary:
        api: openai-completions
        baseURL: !!js process.env.ARE_DSH_MOCK_BASE_URL
        apiKeyEnv: ARE_DSH_MOCK_API_KEY
        defaultContextWindow: 32768
        defaultMaxTokens: 1024
        retryPolicy:
          mode: normal
          maxRetries: 0
        models:
          - id: fixture-model
            contextWindow: 32768
            maxTokens: 1024
