required_evidence_per_candidate:
  - empirical_second_corpus_observation
  - computational_replay_or_counterexample
  - authority_and_operability_attack
  - verifier_disposition
  - correction_or_next_route

observation_vocabulary:
  empirical: [pass, fail, absent, mixed]
  computational: [reproduced, counterexample, inconclusive]
  review: [keep, fix]
  finding: [upheld, refuted, downgraded]
  reconciliation: [replicated, narrowed, demoted, deferred]

reconciliation_rules:
  - replicated requires empirical pass, computational reproduced, no upheld critical or major collapse/authority finding, and exact corpus citations
  - narrowed requires a surviving bounded law plus an upheld scope, framework, or corpus limitation with a finite correction
  - demoted requires a reproduced collapse, vacuity, relation-not-node result, or authority contradiction without a bounded repair
  - deferred requires absent or inconclusive second-corpus evidence, non-terminal verifier disagreement, or missing required coverage
  - any criterion or candidate-source hash mismatch makes the run invalid and requires a versioned restart
  - no reconciliation status grants active or promoted DS-D1 authority

review_contract:
  target_count: 9
  attacker_lenses: [empirical-corpus, computational-replay, authority-operability]
  verifier_lenses: [vacuity, definitional-collapse, scope-framework]
  final_approver: Vlachopulos, Ioannis
  zero_findings_requires_explicit_attack_receipt: true
  refuted_findings_must_be_dropped: true

outputs:
  - attacks.md
  - REPLICATION-MATRIX.md
  - findings.md
