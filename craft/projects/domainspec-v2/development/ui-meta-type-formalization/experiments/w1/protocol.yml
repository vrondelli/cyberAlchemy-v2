schema_version: ui-formalization.w1-protocol.v0.1
protocol_id: UIF-W1-v0.1
status: frozen-before-lane-execution
created_by: SWU-UIF-003A
method_protocol_ref: ../protocol.yml
method_protocol_version: ui-formalization.v0.1
result_contract_ref: result.schema.yml
result_contract_version: ui-formalization.result-contract.w1.v0.1
authority_boundary: experiment evidence only; all UI labels remain formation-deferred
promotion_eligible: false

witness_classes:
  - structural-table
  - exercised-ds-d8-edge
  - separating-fixture

forbidden_shortcuts:
  - self-declared-type-or-kind-only
  - filename-or-framework-convention
  - raw-edge-participation-set-difference
  - ds-d8-endpoint-use-as-formation-authority
  - semantic-inference-or-application-execution

run_policy:
  repetitions: 2
  compare_fields:
    - method_outcome
    - provisional_outcome
    - reason_codes
    - evidence
    - correction_route
    - residue
  on_mismatch: protocol-failure
  lane_preregistration_before_first_run: required
  protocol_changes_after_first_run: forbidden-without-version-bump-and-full-lane-rerun

lane_manifest_contract:
  required_fields:
    - lane_id
    - swu
    - protocol_version
    - result_contract_version
    - status
    - candidates
  status_before_execution: frozen-before-execution
  candidate_required_fields:
    - candidate_id
    - candidate
    - hypothesis_ref
    - fixture_ref
    - criterion_probe
    - expected
    - correction_route
    - reason_codes
    - residue
  fixture_required_roles:
    - positive
    - malformed_negative
    - neighbor_probe
    - graph_coherence

lanes:
  composition:
    swu: SWU-UIF-004
    candidates: [Page, Layout, Component]
  data-interaction:
    swu: SWU-UIF-005
    candidates: [View Model, Form, Action, State Indicator]
  integration-control:
    swu: SWU-UIF-006
    candidates: [Hook, Guard, Binding, Adapter]

method_outcomes:
  - structural-separation-survives
  - structural-collapse-observed
  - inconclusive
  - protocol-failure

provisional_outcomes:
  - candidate-schema-ready
  - merge-candidate
  - relation-not-node
  - framework-vocabulary
  - split-candidate
  - defer-evidence-gap

stop_conditions:
  - stop if a criterion requires semantic inference or application execution
  - stop if a lane edits E0 protocol, schema, runner, fixtures, or results
  - stop if fixtures or expectations are not frozen before the first run
  - stop if repeated lane runs differ on configured compare fields
  - stop promotion claims while real-corpus or round-trip evidence is incomplete

e0_immutability:
  protocol: ../protocol.yml
  result_schema: ../result.schema.yml
  runner: ../e0_runner.py
  results: ../results/e0/
  mutation_allowed: false
