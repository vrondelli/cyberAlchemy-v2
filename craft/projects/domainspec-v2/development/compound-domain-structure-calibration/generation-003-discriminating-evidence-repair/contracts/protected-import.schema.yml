{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/protected-import/v1",
  "title": "Generation-3 protected import manifest v1",
  "type": "object",
  "required": ["schema_version", "generation_tail", "imports", "prohibited_inferences"],
  "properties": {
    "schema_version": {"const": "cdsc.protected-import.v1"},
    "generation_tail": {
      "type": "object",
      "required": ["path", "raw_sha256", "entry_count", "generation_id"],
      "properties": {
        "path": {"const": "projects/domainspec-v2/development/compound-domain-structure-calibration/generations/index.json"},
        "raw_sha256": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "entry_count": {"const": 2},
        "generation_id": {"const": "generation:sha256:24c4e0292197d0d8895bd5a668813437ba6d5c6f02cf6b549d85b2ae350ce683"}
      },
      "additionalProperties": false
    },
    "imports": {
      "type": "array",
      "minItems": 14,
      "maxItems": 14,
      "items": {"$ref": "#/$defs/import"}
    },
    "prohibited_inferences": {
      "type": "array",
      "minItems": 7,
      "uniqueItems": true,
      "items": {"enum": ["candidate-promotion", "ds-d1-formation", "ds-d8-authority", "identity", "pattern-admission", "portability", "ui-status-inflation"]}
    }
  },
  "$defs": {
    "import": {
      "type": "object",
      "required": ["import_id", "owner", "path", "raw_sha256", "stable_handle", "expected_assertions", "allowed_semantics"],
      "properties": {
        "import_id": {"enum": ["parent-f3", "m1-observation", "m2-observation", "generation-2-overlay", "generation-2-projection", "generation-2-f3-result", "generation-2-run", "generation-2-provenance", "generation-2-audit", "ui-corpus", "ui-dossier-policy", "ui-dossier", "ui-integrated-audit-result", "ui-integrated-audit-manifest"]},
        "owner": {"enum": ["compound-domain-structure-calibration", "ui-meta-type-repair"]},
        "path": {"type": "string", "pattern": "^projects/domainspec-v2/development/"},
        "raw_sha256": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "stable_handle": {"type": ["string", "null"]},
        "expected_assertions": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/assertion"}},
        "allowed_semantics": {"enum": ["frozen-parent-substitution-source", "prior-permitted-observation", "prior-breaking-observation", "unresolved-coordinate-source", "evaluator-compatibility-baseline", "frozen-f3-result", "frozen-generation-run", "frozen-generation-provenance", "closed-audit-only", "ui-corpus-boundary-only", "ui-portability-limit-only", "ui-dossier-limit-only", "ui-audit-status-only"]}
      },
      "additionalProperties": false
    },
    "assertion": {
      "type": "object",
      "required": ["kind", "selector", "equals"],
      "properties": {
        "kind": {"enum": ["json-pointer-equals", "text-contains"]},
        "selector": {"type": "string", "minLength": 1},
        "equals": {"type": ["string", "number", "boolean", "null"]}
      },
      "additionalProperties": false
    }
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["generation_tail", "imports", "prohibited_inferences"],
  "x-cdsc-volatile-fields": []
}
