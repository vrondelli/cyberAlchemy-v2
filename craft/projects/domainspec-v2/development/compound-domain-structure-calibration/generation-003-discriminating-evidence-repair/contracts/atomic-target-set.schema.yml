{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/atomic-target-set/v1",
  "title": "Generation-3 atomic target set v1",
  "type": "object",
  "required": ["schema_version", "parent_receipt_handle", "parent_generation_id", "targets"],
  "properties": {
    "schema_version": {"const": "cdsc.atomic-target-set.v1"},
    "parent_receipt_handle": {"const": "record:sha256:6d2066bded781e8dc739eb65f09f5237b131a4c55e7a858a03de8d1f5118681a"},
    "parent_generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "targets": {"type": "array", "minItems": 6, "maxItems": 6, "items": {"$ref": "#/$defs/target"}}
  },
  "$defs": {
    "target": {
      "type": "object",
      "required": ["target_id", "kind", "parent_field_selector", "parent_field_digest", "canonical_proposition", "target_digest"],
      "properties": {
        "target_id": {"enum": ["T-P-01", "T-P-02", "T-P-03", "T-P-04", "T-B-01", "T-B-02"]},
        "kind": {"enum": ["permitted", "breaking"]},
        "parent_field_selector": {"enum": ["semantic.S.permitted.description", "semantic.S.permitted.prediction", "semantic.S.breaking.description", "semantic.S.breaking.prediction"]},
        "parent_field_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "canonical_proposition": {"type": "string", "minLength": 1},
        "target_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"}
      },
      "additionalProperties": false
    }
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["parent_receipt_handle", "parent_generation_id", "targets"],
  "x-cdsc-volatile-fields": []
}
