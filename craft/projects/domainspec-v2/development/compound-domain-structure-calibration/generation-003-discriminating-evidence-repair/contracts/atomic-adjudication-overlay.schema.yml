{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc.atomic-adjudication-overlay.v1",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema_version", "contract_id", "contract_version", "record_id", "canonicalization", "digest_algorithm", "content_digest", "generation_id", "predecessor_generation_id", "input_handles", "status", "semantic", "prohibited_inferences"],
  "properties": {
    "schema_version": {"const": "cdsc.atomic-adjudication-overlay.v1"},
    "contract_id": {"const": "cdsc.atomic-adjudication-overlay"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "input_handles": {"type": "array", "minItems": 7, "uniqueItems": true, "items": {"type": "string"}},
    "status": {"const": "frozen"},
    "semantic": {
      "type": "object",
      "additionalProperties": false,
      "required": ["fixture_id", "baseline_receipt_handle", "target_set_handle", "observation_bindings", "usefulness_result_handle", "adjudication_matrix", "usefulness_adjudication", "uncertainty_resolutions", "carried_uncertainty", "reviewers"],
      "properties": {
        "fixture_id": {"const": "F3"},
        "baseline_receipt_handle": {"type": "string"},
        "target_set_handle": {"type": "string"},
        "observation_bindings": {"type": "array", "minItems": 2, "maxItems": 2},
        "usefulness_result_handle": {"type": "string"},
        "adjudication_matrix": {"type": "array", "minItems": 36, "maxItems": 36, "items": {"$ref": "#/$defs/cell"}},
        "usefulness_adjudication": {"type": "object"},
        "uncertainty_resolutions": {"type": "array", "minItems": 2, "maxItems": 2},
        "carried_uncertainty": {"type": "array", "minItems": 5},
        "reviewers": {"type": "array", "minItems": 1}
      }
    },
    "prohibited_inferences": {"type": "array", "minItems": 7, "uniqueItems": true, "items": {"type": "string"}},
    "created_at": {"type": "string"},
    "storage_path": {"type": "string"}
  },
  "$defs": {
    "cell": {
      "type": "object",
      "additionalProperties": false,
      "required": ["explanation_id", "target_id", "coverage", "state", "explanation_digest", "target_digest", "evidence_handle", "rationale", "review_state"],
      "properties": {
        "explanation_id": {"enum": ["A-01", "A-02", "A-03", "A-04", "A-05", "A-06"]},
        "target_id": {"enum": ["T-P-01", "T-P-02", "T-P-03", "T-P-04", "T-B-01", "T-B-02"]},
        "coverage": {"enum": ["full", "none", "partial"]},
        "state": {"enum": ["explained", "not-explained", "indeterminate"]},
        "explanation_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "target_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "evidence_handle": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "rationale": {"type": "string", "minLength": 20},
        "review_state": {"enum": ["approved", "disputed"]}
      }
    }
  }
}
