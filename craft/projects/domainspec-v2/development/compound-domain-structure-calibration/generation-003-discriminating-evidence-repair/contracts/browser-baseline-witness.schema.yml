{
  "$schema":"https://json-schema.org/draft/2020-12/schema",
  "$id":"cdsc://contracts/browser-baseline-witness/v1",
  "type":"object",
  "required":["schema_version","runtime_handle","source_manifest_handle","vectors","supporting_screenshots","replay_state"],
  "properties":{
    "schema_version":{"const":"cdsc.browser-baseline-witness.v1"},
    "runtime_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "source_manifest_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "vectors":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/vector"}},
    "supporting_screenshots":{"type":"array","items":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"}},
    "replay_state":{"const":"identical"}
  },
  "$defs":{
    "vector":{"type":"object","required":["vector_id","expected","observed","comparison"],"properties":{"vector_id":{"type":"string","minLength":1},"expected":{"$ref":"#/$defs/state"},"observed":{"$ref":"#/$defs/state"},"comparison":{"enum":["match","different"]}},"additionalProperties":false},
    "state":{"type":"object","required":["rendered_child_id","interaction_ports","guard_allowed","notice_present","requested_step","committed_step","route_tree_state"],"properties":{"rendered_child_id":{"type":["string","null"]},"interaction_ports":{"type":"array","uniqueItems":true,"items":{"enum":["onNext","onBack"]}},"guard_allowed":{"type":["boolean","null"]},"notice_present":{"type":"boolean"},"requested_step":{"type":["string","null"]},"committed_step":{"type":"string"},"route_tree_state":{"enum":["mounted","unmounted"]}},"additionalProperties":false}
  },
  "additionalProperties":false,
  "x-cdsc-semantic-fields":["runtime_handle","source_manifest_handle","vectors","supporting_screenshots","replay_state"],
  "x-cdsc-volatile-fields":[]
}
