{
  "$schema":"https://json-schema.org/draft/2020-12/schema",
  "$id":"cdsc://contracts/browser-observation-receipt/v1",
  "type":"object",
  "required":["schema_version","mutation_id","runtime_handle","source_manifest_handle","baseline_witness_handle","target_set_handle","vector_results","target_observations","supporting_screenshots","uncertainty"],
  "properties":{
    "schema_version":{"const":"cdsc.browser-observation-receipt.v1"},
    "mutation_id":{"enum":["M3-P","M3-B"]},
    "runtime_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "source_manifest_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "baseline_witness_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "target_set_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "vector_results":{"type":"array","minItems":1,"items":{"type":"object"}},
    "target_observations":{"type":"array","minItems":2,"items":{"$ref":"#/$defs/target_observation"}},
    "supporting_screenshots":{"type":"array","items":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"}},
    "uncertainty":{"type":"array","items":{"type":"string","minLength":1}}
  },
  "$defs":{
    "target_observation":{"type":"object","required":["target_id","state","evidence_fields"],"properties":{"target_id":{"enum":["T-P-01","T-P-02","T-P-03","T-P-04","T-B-01","T-B-02"]},"state":{"enum":["supported","refuted","indeterminate"]},"evidence_fields":{"type":"array","minItems":1,"uniqueItems":true,"items":{"enum":["rendered_child_id","interaction_ports","guard_allowed","notice_present","requested_step","committed_step","route_tree_state"]}}},"additionalProperties":false}
  },
  "additionalProperties":false,
  "x-cdsc-semantic-fields":["mutation_id","runtime_handle","source_manifest_handle","baseline_witness_handle","target_set_handle","vector_results","target_observations","supporting_screenshots","uncertainty"],
  "x-cdsc-volatile-fields":[]
}
