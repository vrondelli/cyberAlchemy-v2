{
  "$schema":"https://json-schema.org/draft/2020-12/schema",
  "$id":"cdsc://contracts/browser-source-manifest/v1",
  "type":"object",
  "required":["schema_version","runtime_handle","target_set_handle","source_files","translations","protected_roots"],
  "properties":{
    "schema_version":{"const":"cdsc.browser-source-manifest.v1"},
    "runtime_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "target_set_handle":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"},
    "source_files":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/source_file"}},
    "translations":{"type":"array","minItems":1,"items":{"$ref":"#/$defs/translation"}},
    "protected_roots":{"type":"array","minItems":3,"uniqueItems":true,"items":{"type":"string","pattern":"^projects/"}}
  },
  "$defs":{
    "source_file":{"type":"object","required":["path","ranges","raw_sha256"],"properties":{"path":{"type":"string","pattern":"^projects/"},"ranges":{"type":"array","minItems":1,"items":{"type":"array","minItems":2,"maxItems":2,"items":{"type":"integer","minimum":1}}},"raw_sha256":{"type":"string","pattern":"^sha256:[a-f0-9]{64}$"}},"additionalProperties":false},
    "translation":{"type":"object","required":["source_selector","generated_path","adapter_kind"],"properties":{"source_selector":{"type":"string","minLength":1},"generated_path":{"type":"string","pattern":"^harness/browser-baseline/"},"adapter_kind":{"enum":["behavior-copy","runtime-adapter","render-adapter"]}},"additionalProperties":false}
  },
  "additionalProperties":false,
  "x-cdsc-semantic-fields":["runtime_handle","target_set_handle","source_files","translations","protected_roots"],
  "x-cdsc-volatile-fields":[]
}
