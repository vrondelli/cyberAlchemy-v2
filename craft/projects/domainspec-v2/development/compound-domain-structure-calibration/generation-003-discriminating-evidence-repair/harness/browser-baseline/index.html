<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CDSC3 Savvy Baseline</title>
    <style>
      body { margin: 0; background: #f4f6f8; color: #17202a; font: 16px system-ui, sans-serif; }
      main { width: 640px; margin: 32px auto; padding: 24px; border: 1px solid #aab4be; background: #fff; }
      header { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      section { margin-top: 16px; padding: 16px; border: 1px solid #506070; }
      button { margin-right: 8px; padding: 8px 12px; }
      [data-guard-notice] { display: block; margin-top: 16px; padding: 12px; border: 1px solid #b35328; background: #fff4ea; }
      [data-structured-state] { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 16px; padding: 12px; background: #eef2f5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/bundle.js"></script>
  </body>
</html>
