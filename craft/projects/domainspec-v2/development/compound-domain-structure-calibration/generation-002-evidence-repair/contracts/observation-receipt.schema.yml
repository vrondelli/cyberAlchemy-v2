{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/observation-receipt/v1",
  "title": "Generation-2 mutation observation receipt v1",
  "type": "object",
  "required": ["schema_version", "contract_id", "contract_version", "record_id", "canonicalization", "digest_algorithm", "content_digest", "generation_id", "predecessor_generation_id", "input_handles", "status", "semantic", "prohibited_inferences"],
  "properties": {
    "schema_version": {"const": "cdsc.observation-receipt.v1"},
    "contract_id": {"const": "cdsc.observation-receipt"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {"const": null},
    "input_handles": {"type": "array", "minItems": 2, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
    "status": {"const": "frozen"},
    "semantic": {
      "type": "object",
      "required": ["mutation_id", "manifest_handle", "harness_handle", "baseline_witness_handle", "vector_results", "observation_state", "predicted_consequence", "observed_consequence", "uncertainty"],
      "properties": {
        "mutation_id": {"enum": ["M1", "M2"]},
        "manifest_handle": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
        "harness_handle": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "baseline_witness_handle": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
        "vector_results": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/vector_result"}},
        "observation_state": {"enum": ["supported", "refuted", "indeterminate"]},
        "predicted_consequence": {"type": "string", "minLength": 1},
        "observed_consequence": {"type": "string", "minLength": 1},
        "uncertainty": {"type": "array", "items": {"type": "string", "minLength": 1}}
      },
      "additionalProperties": false
    },
    "prohibited_inferences": {"type": "array", "minItems": 7, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "$defs": {
    "vector_result": {
      "type": "object",
      "required": ["vector_id", "baseline", "mutant", "comparison"],
      "properties": {
        "vector_id": {"type": "string", "minLength": 1},
        "baseline": {"type": "object"},
        "mutant": {"type": "object"},
        "comparison": {"enum": ["match", "different", "indeterminate"]}
      },
      "additionalProperties": false
    }
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-volatile-fields": ["created_at", "storage_path"]
}
