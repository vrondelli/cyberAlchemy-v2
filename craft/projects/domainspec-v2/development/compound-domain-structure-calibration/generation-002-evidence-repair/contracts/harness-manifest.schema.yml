{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/harness-manifest/v1",
  "title": "Generation-2 source-derived harness manifest v1",
  "type": "object",
  "required": ["schema_version", "contract_id", "contract_version", "record_id", "canonicalization", "digest_algorithm", "content_digest", "generation_id", "predecessor_generation_id", "input_handles", "status", "semantic", "prohibited_inferences"],
  "properties": {
    "schema_version": {"const": "cdsc.harness-manifest.v1"},
    "contract_id": {"const": "cdsc.harness-manifest"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {"const": null},
    "input_handles": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
    "status": {"const": "frozen"},
    "semantic": {
      "type": "object",
      "required": ["parent_generation_id", "source_selectors", "harness_digest", "baseline_vectors", "observable_fields", "mutations"],
      "properties": {
        "parent_generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
        "source_selectors": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/source_selector"}},
        "harness_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "baseline_vectors": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/vector"}},
        "observable_fields": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
        "mutations": {"type": "array", "minItems": 2, "maxItems": 2, "items": {"$ref": "#/$defs/mutation"}}
      },
      "additionalProperties": false
    },
    "prohibited_inferences": {"type": "array", "minItems": 7, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "$defs": {
    "source_selector": {
      "type": "object",
      "required": ["path", "ranges", "digest"],
      "properties": {
        "path": {"type": "string", "pattern": "^projects/"},
        "ranges": {"type": "array", "minItems": 1, "items": {"type": "array", "minItems": 2, "maxItems": 2, "items": {"type": "integer", "minimum": 1}}},
        "digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"}
      },
      "additionalProperties": false
    },
    "vector": {
      "type": "object",
      "required": ["vector_id", "input", "expected"],
      "properties": {"vector_id": {"type": "string", "minLength": 1}, "input": {"type": "object"}, "expected": {"type": "object"}},
      "additionalProperties": false
    },
    "mutation": {
      "type": "object",
      "required": ["mutation_id", "kind", "target", "allowed_edit_surface", "prediction", "vector_ids", "observables", "stop_conditions"],
      "properties": {
        "mutation_id": {"enum": ["M1", "M2"]},
        "kind": {"enum": ["permitted", "breaking"]},
        "target": {"type": "string", "minLength": 1},
        "allowed_edit_surface": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
        "prediction": {"type": "string", "minLength": 1},
        "vector_ids": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
        "observables": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
        "stop_conditions": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}}
      },
      "additionalProperties": false
    }
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-volatile-fields": ["created_at", "storage_path"]
}
