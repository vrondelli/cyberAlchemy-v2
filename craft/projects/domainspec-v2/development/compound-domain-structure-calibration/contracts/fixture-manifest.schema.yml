{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/fixture-manifest/v1",
  "title": "Compound-domain-structure calibration fixture manifest v1",
  "type": "object",
  "required": [
    "schema_version",
    "contract_id",
    "contract_version",
    "record_id",
    "canonicalization",
    "digest_algorithm",
    "content_digest",
    "generation_id",
    "predecessor_generation_id",
    "input_handles",
    "status",
    "semantic",
    "prohibited_inferences"
  ],
  "properties": {
    "schema_version": {"const": "cdsc.fixture-manifest.v1"},
    "contract_id": {"const": "cdsc.fixture-manifest"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {
      "oneOf": [
        {"type": "null"},
        {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"}
      ]
    },
    "input_handles": {
      "type": "array",
      "maxItems": 0
    },
    "status": {"const": "frozen"},
    "semantic": {
      "type": "object",
      "required": ["source_digest_algorithm", "fixture_ids", "fixtures"],
      "properties": {
        "source_digest_algorithm": {"const": "source-slice-sha256-v1"},
        "fixture_ids": {
          "type": "array",
          "minItems": 3,
          "maxItems": 3,
          "uniqueItems": true,
          "prefixItems": [
            {"const": "F1"},
            {"const": "F2"},
            {"const": "F3"}
          ]
        },
        "fixtures": {
          "type": "array",
          "minItems": 3,
          "maxItems": 3,
          "items": {"$ref": "#/$defs/fixture"}
        }
      },
      "additionalProperties": false
    },
    "prohibited_inferences": {
      "type": "array",
      "minItems": 4,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "$defs": {
    "digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "range": {
      "type": "array",
      "minItems": 2,
      "maxItems": 2,
      "prefixItems": [
        {"type": "integer", "minimum": 1},
        {"type": "integer", "minimum": 1}
      ]
    },
    "source": {
      "type": "object",
      "required": ["path", "ranges", "digest"],
      "properties": {
        "path": {"type": "string", "pattern": "^projects/"},
        "ranges": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/range"}
        },
        "digest": {"$ref": "#/$defs/digest"}
      },
      "additionalProperties": false
    },
    "fixture": {
      "type": "object",
      "required": [
        "fixture_id",
        "specimen_name",
        "calibration_role",
        "sources",
        "semantic_source_digest",
        "prohibited_inferences"
      ],
      "properties": {
        "fixture_id": {"enum": ["F1", "F2", "F3"]},
        "specimen_name": {"type": "string", "minLength": 1},
        "calibration_role": {
          "enum": ["likely-residual-lead", "collapse-control", "disputed-case"]
        },
        "sources": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/source"}
        },
        "semantic_source_digest": {"$ref": "#/$defs/digest"},
        "prohibited_inferences": {
          "type": "array",
          "minItems": 4,
          "uniqueItems": true,
          "items": {"type": "string", "minLength": 1}
        }
      },
      "additionalProperties": false
    }
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-volatile-fields": ["created_at", "storage_path"],
  "x-cdsc-content-digest-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-record-id-fields": ["contract_id", "contract_version", "content_digest"],
  "x-cdsc-generation-id-fields": ["record_id", "predecessor_generation_id", "input_handles"]
}
