{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/evidence-receipt/v1",
  "title": "Compound-domain-structure calibration evidence receipt v1",
  "type": "object",
  "required": [
    "schema_version",
    "contract_id",
    "contract_version",
    "record_id",
    "canonicalization",
    "digest_algorithm",
    "content_digest",
    "generation_id",
    "predecessor_generation_id",
    "input_handles",
    "status",
    "semantic",
    "prohibited_inferences"
  ],
  "properties": {
    "schema_version": {"const": "cdsc.evidence-receipt.v1"},
    "contract_id": {"const": "cdsc.evidence-receipt"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"$ref": "#/$defs/digest"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {
      "oneOf": [
        {"type": "null"},
        {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"}
      ]
    },
    "input_handles": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "status": {"enum": ["draft", "frozen", "invalid"]},
    "semantic": {
      "type": "object",
      "required": ["fixture_id", "G", "A", "Q", "sigma_matrix", "S", "D", "U", "reviewers"],
      "properties": {
        "fixture_id": {"enum": ["F1", "F2", "F3"]},
        "G": {"$ref": "#/$defs/observed_graph"},
        "A": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/explanation"}
        },
        "Q": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/observable"}
        },
        "sigma_matrix": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/predicate_cell"}
        },
        "S": {"$ref": "#/$defs/substitution_pair"},
        "D": {"$ref": "#/$defs/usefulness_delta"},
        "U": {
          "type": "array",
          "items": {"$ref": "#/$defs/uncertainty"}
        },
        "reviewers": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/reviewer"}
        }
      },
      "additionalProperties": false
    },
    "prohibited_inferences": {
      "type": "array",
      "minItems": 4,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "reviewed_at": {"type": "string", "format": "date-time"},
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "$defs": {
    "digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "selector": {"type": "string", "pattern": "^projects/.+:[0-9]"},
    "observed_graph": {
      "type": "object",
      "required": ["boundary", "members", "relations", "interactions", "effects"],
      "properties": {
        "boundary": {"type": "string", "minLength": 1},
        "members": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "relations": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "interactions": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "effects": {"type": "array", "items": {"type": "string", "minLength": 1}}
      },
      "additionalProperties": false
    },
    "explanation": {
      "type": "object",
      "required": ["explanation_id", "kind", "statement"],
      "properties": {
        "explanation_id": {"type": "string", "pattern": "^A-[0-9]{2}$"},
        "kind": {"enum": ["atomic-type", "contextual-role", "projection", "ds-d8-relationship", "architecture-pattern", "named-instance", "aggregation", "sequencing"]},
        "statement": {"type": "string", "minLength": 1}
      },
      "additionalProperties": false
    },
    "observable": {
      "type": "object",
      "required": ["observable_id", "class", "statement", "selectors"],
      "properties": {
        "observable_id": {"type": "string", "pattern": "^Q-[0-9]{2}$"},
        "class": {"enum": ["boundary", "invariant", "lifecycle", "substitution", "failure", "downstream-decision"]},
        "statement": {"type": "string", "minLength": 1},
        "selectors": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/selector"}}
      },
      "additionalProperties": false
    },
    "predicate_cell": {
      "type": "object",
      "required": ["explanation_id", "observable_id", "state", "selectors", "rationale", "review_state"],
      "properties": {
        "explanation_id": {"type": "string", "pattern": "^A-[0-9]{2}$"},
        "observable_id": {"type": "string", "pattern": "^Q-[0-9]{2}$"},
        "state": {"enum": ["explained", "not-explained", "indeterminate"]},
        "selectors": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/selector"}},
        "rationale": {"type": "string", "minLength": 1},
        "review_state": {"enum": ["approved", "disputed"]}
      },
      "additionalProperties": false
    },
    "substitution": {
      "type": "object",
      "required": ["substitution_id", "description", "prediction", "observation_state", "selectors"],
      "properties": {
        "substitution_id": {"type": "string", "minLength": 1},
        "description": {"type": "string", "minLength": 1},
        "prediction": {"type": "string", "minLength": 1},
        "observation_state": {"enum": ["supported", "refuted", "indeterminate"]},
        "selectors": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/selector"}}
      },
      "additionalProperties": false
    },
    "substitution_pair": {
      "type": "object",
      "required": ["permitted", "breaking"],
      "properties": {
        "permitted": {"$ref": "#/$defs/substitution"},
        "breaking": {"$ref": "#/$defs/substitution"}
      },
      "additionalProperties": false
    },
    "usefulness_delta": {
      "type": "object",
      "required": ["baseline_decision", "residual_decision", "deterministic", "nonzero", "selectors"],
      "properties": {
        "baseline_decision": {"type": "string", "minLength": 1},
        "residual_decision": {"type": "string", "minLength": 1},
        "deterministic": {"type": "boolean"},
        "nonzero": {"type": "boolean"},
        "selectors": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/selector"}}
      },
      "additionalProperties": false
    },
    "uncertainty": {
      "type": "object",
      "required": ["uncertainty_id", "state", "statement"],
      "properties": {
        "uncertainty_id": {"type": "string", "minLength": 1},
        "state": {"enum": ["missing", "disputed", "untested", "non-portable"]},
        "statement": {"type": "string", "minLength": 1}
      },
      "additionalProperties": false
    },
    "reviewer": {
      "type": "object",
      "required": ["reviewer_id", "state"],
      "properties": {
        "reviewer_id": {"type": "string", "minLength": 1},
        "state": {"enum": ["approved", "disputed"]}
      },
      "additionalProperties": false
    }
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-volatile-fields": ["reviewed_at", "created_at", "storage_path"],
  "x-cdsc-content-digest-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-record-id-fields": ["contract_id", "contract_version", "content_digest"],
  "x-cdsc-generation-id-fields": ["record_id", "predecessor_generation_id", "input_handles"]
}
