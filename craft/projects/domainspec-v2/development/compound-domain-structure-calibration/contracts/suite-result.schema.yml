{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/suite-result/v1",
  "title": "Compound-domain-structure calibration suite result v1",
  "type": "object",
  "required": [
    "schema_version",
    "contract_id",
    "contract_version",
    "record_id",
    "canonicalization",
    "digest_algorithm",
    "content_digest",
    "generation_id",
    "predecessor_generation_id",
    "input_handles",
    "status",
    "semantic",
    "prohibited_inferences"
  ],
  "properties": {
    "schema_version": {"const": "cdsc.suite-result.v1"},
    "contract_id": {"const": "cdsc.suite-result"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {
      "oneOf": [
        {"type": "null"},
        {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"}
      ]
    },
    "input_handles": {
      "type": "array",
      "minItems": 3,
      "maxItems": 3,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "status": {"enum": ["calibration-defer", "calibration-fail", "calibration-pass"]},
    "semantic": {
      "type": "object",
      "required": ["fixture_result_handles", "control_fixture_id", "replay_state", "suite_verdict", "next_route"],
      "properties": {
        "fixture_result_handles": {
          "type": "array",
          "minItems": 3,
          "maxItems": 3,
          "uniqueItems": true,
          "items": {"type": "string", "minLength": 1}
        },
        "control_fixture_id": {"const": "F2"},
        "replay_state": {"enum": ["not-run", "identical", "drift"]},
        "suite_verdict": {"enum": ["CALIBRATION-DEFER", "CALIBRATION-FAIL", "CALIBRATION-PASS"]},
        "next_route": {"enum": ["evidence-repair", "method-review", "bounded-follow-up-research"]}
      },
      "additionalProperties": false
    },
    "prohibited_inferences": {
      "type": "array",
      "minItems": 6,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-volatile-fields": ["created_at", "storage_path"],
  "x-cdsc-content-digest-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-record-id-fields": ["contract_id", "contract_version", "content_digest"],
  "x-cdsc-generation-id-fields": ["record_id", "predecessor_generation_id", "input_handles"]
}
