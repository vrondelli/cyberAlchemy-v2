{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/evaluation-result/v1",
  "title": "Compound-domain-structure calibration fixture evaluation result v1",
  "type": "object",
  "required": [
    "schema_version",
    "contract_id",
    "contract_version",
    "record_id",
    "canonicalization",
    "digest_algorithm",
    "content_digest",
    "generation_id",
    "predecessor_generation_id",
    "input_handles",
    "status",
    "semantic",
    "prohibited_inferences"
  ],
  "properties": {
    "schema_version": {"const": "cdsc.evaluation-result.v1"},
    "contract_id": {"const": "cdsc.evaluation-result"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {
      "oneOf": [
        {"type": "null"},
        {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"}
      ]
    },
    "input_handles": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "status": {"enum": ["insufficient-evidence", "explained", "rubric-fail", "residual-supported"]},
    "semantic": {
      "type": "object",
      "required": ["fixture_id", "residue_observable_ids", "evidence_complete", "residual_conditions", "fixture_outcome", "input_digest", "evaluator_version"],
      "properties": {
        "fixture_id": {"enum": ["F1", "F2", "F3"]},
        "residue_observable_ids": {
          "type": "array",
          "uniqueItems": true,
          "items": {"type": "string", "pattern": "^Q-[0-9]{2}$"}
        },
        "evidence_complete": {"type": "boolean"},
        "residual_conditions": {
          "type": "object",
          "required": ["boundary_invariant_supported", "permitted_substitution_preserved", "breaking_substitution_consequence", "usefulness_deterministic", "usefulness_nonzero"],
          "properties": {
            "boundary_invariant_supported": {"type": "boolean"},
            "permitted_substitution_preserved": {"type": "boolean"},
            "breaking_substitution_consequence": {"type": "boolean"},
            "usefulness_deterministic": {"type": "boolean"},
            "usefulness_nonzero": {"type": "boolean"}
          },
          "additionalProperties": false
        },
        "fixture_outcome": {"enum": ["INSUFFICIENT-EVIDENCE", "EXPLAINED", "RUBRIC-FAIL", "RESIDUAL-SUPPORTED"]},
        "input_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
        "evaluator_version": {"const": "cdsc-evaluator-v1"}
      },
      "additionalProperties": false
    },
    "prohibited_inferences": {
      "type": "array",
      "minItems": 4,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-volatile-fields": ["created_at", "storage_path"],
  "x-cdsc-content-digest-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-record-id-fields": ["contract_id", "contract_version", "content_digest"],
  "x-cdsc-generation-id-fields": ["record_id", "predecessor_generation_id", "input_handles"]
}
