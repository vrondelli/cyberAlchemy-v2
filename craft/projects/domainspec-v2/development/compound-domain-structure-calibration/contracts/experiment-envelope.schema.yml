{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "cdsc://contracts/experiment-envelope/v1",
  "title": "Compound-domain-structure calibration immutable envelope v1",
  "type": "object",
  "required": [
    "schema_version",
    "contract_id",
    "contract_version",
    "record_id",
    "canonicalization",
    "digest_algorithm",
    "content_digest",
    "generation_id",
    "predecessor_generation_id",
    "input_handles",
    "status",
    "semantic",
    "prohibited_inferences"
  ],
  "properties": {
    "schema_version": {"const": "cdsc.experiment-envelope.v1"},
    "contract_id": {"type": "string", "minLength": 1},
    "contract_version": {"type": "string", "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {
      "oneOf": [
        {"type": "null"},
        {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"}
      ]
    },
    "input_handles": {
      "type": "array",
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "status": {
      "enum": [
        "draft",
        "frozen",
        "valid",
        "invalid",
        "complete",
        "insufficient-evidence",
        "explained",
        "rubric-fail",
        "residual-supported",
        "calibration-defer",
        "calibration-fail",
        "calibration-pass"
      ]
    },
    "semantic": {"type": "object"},
    "prohibited_inferences": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {"type": "string", "minLength": 1}
    },
    "created_at": {"type": "string", "format": "date-time"},
    "storage_path": {"type": "string", "minLength": 1}
  },
  "additionalProperties": false,
  "x-cdsc-semantic-fields": [
    "contract_id",
    "contract_version",
    "predecessor_generation_id",
    "input_handles",
    "status",
    "semantic",
    "prohibited_inferences"
  ],
  "x-cdsc-volatile-fields": ["created_at", "storage_path"],
  "x-cdsc-content-digest-fields": ["semantic", "prohibited_inferences"],
  "x-cdsc-record-id-fields": ["contract_id", "contract_version", "content_digest"],
  "x-cdsc-generation-id-fields": ["record_id", "predecessor_generation_id", "input_handles"]
}
