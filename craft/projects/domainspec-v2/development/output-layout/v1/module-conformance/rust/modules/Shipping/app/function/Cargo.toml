[package]
name = "alch-function"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
[dependencies]
serde_json = "=1.0.149"
regex = "=1.13.1"
sha2 = "=0.10.9"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
axum = "=0.8.4"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "time"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
[workspace]
[profile.dev]
debug = 0
