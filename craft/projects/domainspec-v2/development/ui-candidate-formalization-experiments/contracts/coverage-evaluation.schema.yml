{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ucfe://contracts/coverage-evaluation/v1",
  "title": "UI candidate existing-coverage evaluation v1",
  "type": "object",
  "required": ["schema_version", "candidate_id", "alternative_id", "dimensions", "outcome", "evidence_handles"],
  "properties": {
    "schema_version": {"const": "ucfe.coverage-evaluation.v1"},
    "candidate_id": {"type": "string", "pattern": "^DS-D1\\.[0-9]+$"},
    "alternative_id": {"type": "string", "minLength": 1},
    "dimensions": {
      "type": "object",
      "required": ["valid_instance_preservation", "invalid_instance_rejection", "substitutability", "composition_parity", "consequence_parity", "no_loss_audit"],
      "properties": {
        "valid_instance_preservation": {"$ref": "#/$defs/dimension"},
        "invalid_instance_rejection": {"$ref": "#/$defs/dimension"},
        "substitutability": {"$ref": "#/$defs/dimension"},
        "composition_parity": {"$ref": "#/$defs/dimension"},
        "consequence_parity": {"$ref": "#/$defs/dimension"},
        "no_loss_audit": {"$ref": "#/$defs/dimension"}
      },
      "additionalProperties": false
    },
    "outcome": {"enum": ["pass", "fail", "incomplete"]},
    "evidence_handles": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}
  },
  "additionalProperties": false,
  "$defs": {
    "dimension": {
      "type": "object",
      "required": ["state", "evidence_handles"],
      "properties": {
        "state": {"enum": ["pass", "fail", "missing"]},
        "evidence_handles": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}
      },
      "additionalProperties": false
    }
  }
}
