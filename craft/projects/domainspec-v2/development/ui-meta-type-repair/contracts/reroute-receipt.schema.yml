{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ui-repair://contracts/reroute-receipt/v1",
  "title": "UI repair two-sided reroute receipt v1",
  "type": "object",
  "required": ["schema_version", "specimen_digest", "source_contract", "source_outcome", "destination_contract", "destination_outcome", "destination_handle", "owner_handle", "disposition", "record_state", "prohibited_inferences"],
  "properties": {
    "schema_version": {"const": "ui-repair.reroute-receipt.v1"},
    "specimen_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "source_contract": {"type": "string", "minLength": 1},
    "source_outcome": {"enum": ["rejected", "accepted", "invalid"]},
    "destination_contract": {"type": "string", "minLength": 1},
    "destination_outcome": {"enum": ["shape-accepted", "rejected", "pending-owner", "not-testable"]},
    "destination_handle": {"type": ["string", "null"]},
    "owner_handle": {"type": ["string", "null"]},
    "disposition": {"enum": ["rerouted", "not-rerouted", "pending-owner", "not-testable", "invalid"]},
    "record_state": {"enum": ["complete", "invalid"]},
    "prohibited_inferences": {"type": "array", "minItems": 3, "uniqueItems": true, "items": {"type": "string"}}
  },
  "additionalProperties": false
}
