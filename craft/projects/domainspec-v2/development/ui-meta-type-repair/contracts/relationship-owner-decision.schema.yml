{
  "$schema":"https://json-schema.org/draft/2020-12/schema",
  "$id":"ui-repair://contracts/relationship-owner-decision/v1",
  "title":"UI repair relationship owner decision v1",
  "type":"object",
  "required":["schema_version","packet","authority","owner","decisions","decision_state","prohibited_inferences"],
  "properties":{
    "schema_version":{"const":"ui-repair.relationship-owner-decision.v1"},
    "packet":{"type":"object","required":["record_id","generation_id","content_digest"],"properties":{"record_id":{"pattern":"^record:sha256:[a-f0-9]{64}$"},"generation_id":{"pattern":"^generation:sha256:[a-f0-9]{64}$"},"content_digest":{"pattern":"^sha256:[a-f0-9]{64}$"}},"additionalProperties":false},
    "authority":{"type":"object","required":["id","version","digest","signature_count","effect"],"properties":{"id":{"const":"DS-D8"},"version":{"const":1},"digest":{"pattern":"^sha256:[a-f0-9]{64}$"},"signature_count":{"const":30},"effect":{"const":"none"}},"additionalProperties":false},
    "owner":{"const":"owner:domainspec-v2/DS-D8"},
    "decisions":{"type":"array","minItems":4,"maxItems":4,"items":{"$ref":"#/$defs/decision"}},
    "decision_state":{"const":"resolved-no-authority-effect"},
    "prohibited_inferences":{"type":"array","minItems":5,"uniqueItems":true,"items":{"type":"string"}}
  },
  "additionalProperties":false,
  "$defs":{"decision":{"type":"object","required":["question_id","selected_option_id","disposition","authority_effect","rationale","evidence_obligations","admitted_signatures","decision_handle"],"properties":{"question_id":{"enum":["action-source","hook-binding","guard-target","binding-node-relation"]},"selected_option_id":{"type":"string","minLength":1},"disposition":{"enum":["route-open","retained-current"]},"authority_effect":{"const":"none"},"rationale":{"type":"string","minLength":1},"evidence_obligations":{"type":"array","uniqueItems":true,"items":{"type":"string","minLength":1}},"admitted_signatures":{"type":"array","maxItems":0},"decision_handle":{"type":"string","pattern":"^decision:DEC-UIR-010\\.[1-4]$"}},"additionalProperties":false}}
}
