{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ui-repair://contracts/reviewer-projection/v1",
  "title": "UI repair corpus reviewer projection v1",
  "type": "object",
  "required": ["schema_version", "corpus_receipt_id", "reviewer", "candidate_ref", "projection_status", "statement", "prohibited_inference"],
  "properties": {
    "schema_version": {"const": "ui-repair.reviewer-projection.v1"},
    "corpus_receipt_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "reviewer": {"type": "string", "minLength": 1},
    "candidate_ref": {"type": "string", "minLength": 1},
    "projection_status": {"enum": ["proposed", "disputed", "not-applicable"]},
    "statement": {"type": "string", "minLength": 1},
    "prohibited_inference": {"const": "reviewer-projection-is-not-source-fact-or-type-identity"}
  },
  "additionalProperties": false
}
