{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ui-repair://contracts/contract-manifest/v1",
  "title": "UI repair contract manifest v1",
  "type": "object",
  "required": ["schema_version", "contract_id", "contract_version", "canonicalization", "digest_algorithm", "semantic_fields", "volatile_fields"],
  "properties": {
    "schema_version": {"const": "ui-repair.contract-manifest.v1"},
    "contract_id": {"type": "string", "minLength": 1},
    "contract_version": {"type": "string", "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "semantic_fields": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
    "volatile_fields": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}
  },
  "additionalProperties": false
}
