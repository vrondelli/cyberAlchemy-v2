{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ui-repair://contracts/dossier-policy-evaluation/v1",
  "title": "UI repair per-candidate dossier policy evaluation v1",
  "type": "object",
  "required": ["schema_version", "policy_id", "source_handles", "required_counts", "candidate_evaluations", "overall_state", "prohibited_inferences"],
  "properties": {
    "schema_version": {"const": "ui-repair.dossier-policy-evaluation.v1"},
    "policy_id": {"const": "DEC-UIR-008/009-v1"},
    "source_handles": {"type": "object", "required": ["corpus_generation", "dossier_generation", "accepted_review"], "properties": {"corpus_generation": {"$ref": "#/$defs/generation"}, "dossier_generation": {"$ref": "#/$defs/generation"}, "accepted_review": {"type": "string", "minLength": 1}}, "additionalProperties": false},
    "required_counts": {"$ref": "#/$defs/counts"},
    "candidate_evaluations": {"type": "array", "minItems": 1, "items": {"$ref": "#/$defs/evaluation"}},
    "overall_state": {"enum": ["pass", "missing"]},
    "prohibited_inferences": {"type": "array", "minItems": 5, "uniqueItems": true, "items": {"type": "string"}}
  },
  "additionalProperties": false,
  "$defs": {
    "generation": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "counts": {"type": "object", "required": ["real_corpora", "independent_authors", "implementation_styles", "independent_agreeing_reviewers"], "properties": {"real_corpora": {"type": "integer", "minimum": 0}, "independent_authors": {"type": "integer", "minimum": 0}, "implementation_styles": {"type": "integer", "minimum": 0}, "independent_agreeing_reviewers": {"type": "integer", "minimum": 0}}, "additionalProperties": false},
    "independentPositive": {"type": "object", "required": ["state", "partial_correspondence_handles", "rationale_handle"], "properties": {"state": {"enum": ["missing", "not-evaluated"]}, "partial_correspondence_handles": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}, "rationale_handle": {"oneOf": [{"type": "string", "minLength": 1}, {"type": "null"}]}}, "additionalProperties": false},
    "evaluation": {"type": "object", "required": ["candidate_id", "label", "observed_counts", "required_counts", "independence_valid", "portability_state", "evidence_handles", "independent_positive"], "properties": {"candidate_id": {"type": "string", "pattern": "^DS-D1\\.[0-9]+$"}, "label": {"type": "string", "minLength": 1}, "observed_counts": {"$ref": "#/$defs/counts"}, "required_counts": {"$ref": "#/$defs/counts"}, "independence_valid": {"type": "boolean"}, "portability_state": {"enum": ["pass", "missing"]}, "evidence_handles": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}, "independent_positive": {"$ref": "#/$defs/independentPositive"}}, "additionalProperties": false}
  }
}
