{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ui-repair://contracts/mutation-ledger/v1",
  "title": "UI repair mandatory mutation ledger v1",
  "type": "object",
  "required": ["schema_version", "contract_id", "contract_version", "record_id", "canonicalization", "digest_algorithm", "content_digest", "generation_id", "predecessor_generation_id", "input_handles", "status", "semantic", "summary", "created_at"],
  "properties": {
    "schema_version": {"const": "ui-repair.mutation-ledger.v1"},
    "contract_id": {"const": "ui-repair.mutation-ledger"},
    "contract_version": {"const": "1.0.0"},
    "record_id": {"type": "string", "pattern": "^record:sha256:[a-f0-9]{64}$"},
    "canonicalization": {"const": "canonical-json-v1"},
    "digest_algorithm": {"const": "sha256-v1"},
    "content_digest": {"type": "string", "pattern": "^sha256:[a-f0-9]{64}$"},
    "generation_id": {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"},
    "predecessor_generation_id": {"oneOf": [{"type": "null"}, {"type": "string", "pattern": "^generation:sha256:[a-f0-9]{64}$"}]},
    "input_handles": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string"}},
    "status": {"const": "complete"},
    "semantic": {
      "type": "object",
      "required": ["manifest", "cases"],
      "properties": {
        "manifest": {"type": "object"},
        "cases": {"type": "array", "minItems": 165, "maxItems": 165}
      },
      "additionalProperties": false
    },
    "summary": {
      "type": "object",
      "required": ["case_count", "deletion", "empty", "whitespace", "wrong_fixed", "parity_pass"],
      "properties": {
        "case_count": {"const": 165},
        "deletion": {"const": 52},
        "empty": {"const": 52},
        "whitespace": {"const": 52},
        "wrong_fixed": {"const": 9},
        "parity_pass": {"const": 165}
      },
      "additionalProperties": false
    },
    "created_at": {"type": "string", "format": "date-time"}
  },
  "additionalProperties": false
}
