{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "ui-repair://contracts/normalized-result/v1",
  "title": "UI repair normalized result v1",
  "type": "object",
  "required": ["schema_version", "outcome", "code_registry", "violation_codes"],
  "properties": {
    "schema_version": {"const": "ui-repair.normalized-result.v1"},
    "outcome": {"enum": ["accepted", "rejected", "invalid", "pending-owner", "not-testable", "defer", "evidence-complete", "dossier-zeroed"]},
    "code_registry": {"const": "ui-repair-violations/v1"},
    "violation_codes": {"type": "array", "uniqueItems": true, "items": {"enum": ["ATTRIBUTE-MISSING", "ATTRIBUTE-EMPTY", "ATTRIBUTE-WHITESPACE", "DUPLICATE-KEY", "CRITERIA-CONFLICT", "FIXED-VALUE-MISMATCH", "NONSTRING-VALUE", "UNKNOWN-RULE"]}},
    "message": {"type": "string"}
  },
  "additionalProperties": false
}
