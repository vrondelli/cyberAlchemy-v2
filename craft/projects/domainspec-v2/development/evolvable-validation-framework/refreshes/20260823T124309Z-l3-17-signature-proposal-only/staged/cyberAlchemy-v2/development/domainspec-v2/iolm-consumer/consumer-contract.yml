schema_version: iolm-domainspec-evidence-consumer-contract/v1
contract_id: IOLM-DOMAINSPEC-EVIDENCE-CONSUMER
contract_version: 1
status: candidate
proof_role: independent-consumer
production_authorized: false

authority:
  contract_owner: private-iolm-product-owner
  upstream_semantic_owner: domainspec-v2
  machine_contract: cyberAlchemy-v2/development/domainspec-v2/iolm-consumer/consumer-contract.yml
  receipt_schema: cyberAlchemy-v2/development/domainspec-v2/iolm-consumer/receipt.schema.json
  markdown_is_machine_source: false

allowed_upstream_stages:
  evf-l0-core:
    consumer_swu: SWU-IOLM-DSC-A
    downstream_claim: narrow-executable-proof-consumed-by-private-application
    required_handles:
      - source
      - graph
      - obligation
      - test_case
      - binding
      - evaluator
      - execution
      - positive_receipt
      - negative_receipt
    bte_terminal_eligible: false
  bte-core:
    consumer_swu: SWU-IOLM-DSC-B
    downstream_claim: bounded-backend-breadth-consumed-without-projection-drift
    required_handles:
      - source
      - profile
      - registry
      - schema
      - graph
      - O_spec
      - O_gen
      - T_gen
      - E_run
      - binding
      - evaluator
      - mutations
      - core_receipt
    expected_backend_node_kinds: 13
    expected_backend_signatures: 17
    bte_terminal_eligible: true

input_rules:
  exact_handle_identity: required
  raw_digest_match: required
  source_provenance_unchanged: required
  freshness_identity: required
  self_authored_upstream: forbidden
  fixture_or_schema_as_run_evidence: forbidden
  accepted_postures:
    - candidate
    - authoritative
  authority_gate: G-DSV2-SG

required_checks:
  - imported_ids_unchanged
  - imported_relations_unchanged
  - source_provenance_unchanged
  - deterministic_rebuild
  - semantic_bytes_unchanged_by_learner_state
  - semantic_hash_unchanged_by_navigation_state
  - graph_hierarchy_table_get_parity
  - negative_suite_passed

required_negative_classes:
  - missing
  - empty
  - stale-digest
  - unknown-id
  - duplicate
  - wrong-stage
  - self-authored-upstream
  - fixture-only
  - view-parity-drift
  - semantic-mutating-overlay
  - surviving-negative

output:
  schema_version: iolm-domainspec-evidence-consumer-receipt/v1
  owner: private-iolm-product-owner
  freshness: per-independent-run
  declared_writes:
    - cyberAlchemy-v2/development/interactive-ontology-learning-map/prototype/runs/domainspec-consumer/<run-id>/
  upstream_writes: forbidden
  semantic_authority_writes: forbidden

revocation:
  on_change:
    - upstream-handle
    - upstream-digest
    - source
    - profile
    - registry
    - schema
    - graph
    - obligation
    - test-case
    - binding
    - evaluator
    - mutation
    - consumer-posture
    - contract
    - projection-output
  recovery: accept-fresh-upstream-handle-rerun-all-checks-and-negatives-emit-new-receipt

forbidden_claims:
  - predicate-authority
  - O_spec-ownership
  - profile-admission
  - FPR-closure
  - semantic-satisfiability
  - production-readiness
  - public-release
  - upstream-authority-promotion
