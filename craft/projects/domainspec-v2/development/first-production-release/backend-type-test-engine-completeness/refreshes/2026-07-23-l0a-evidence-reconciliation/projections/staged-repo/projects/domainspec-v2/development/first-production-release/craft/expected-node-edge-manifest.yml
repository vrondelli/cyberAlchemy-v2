schema_version: 0.1.0
manifest_id: DSV2-FIRST-PRODUCTION-RELEASE-FRONTIERS
status: candidate-execution-projection
production_authorized: false
authority: >-
  This file is a machine-readable roadmap projection. The accepted decision owns
  product scope; DomainSpec-v2 owner surfaces own meaning; the Craft ledger owns
  continuation state; immutable release records own candidate authorization.
sources:
  accepted_decision: projects/domainspec-v2/development/first-production-release/decisions/2026-07-12-product-release-contract.md
  evidence: projects/domainspec-v2/development/first-production-release/research/2026-07-12-expanded-capability-frontiers/research.md
  approved_findings: projects/domainspec-v2/development/first-production-release/research/2026-07-12-expanded-capability-frontiers/findings.md
  roadmap: projects/domainspec-v2/development/first-production-release/ROADMAP.md
  craft_authority: projects/domainspec-v2/.craft/ledger.yml

claim_boundary:
  contract_planes: [B, Sg, A_req, O_spec, T_gen, I_struct]
  internal_proof_artifacts: [G, F_struct, F_state, E_run]
  coverage_denominator: O_spec(P)
  coverage_required:
    - nonempty exact O_spec and O_gen equality
    - every Expected(o) outcome satisfied
    - every Req_spec(o) evidence class present
    - zero skip, todo, placeholder, duplicate, orphan, absent, or unrunnable items
    - one killed mutation per obligation key
  equivalence_limit: Sg-to-G-to-Sg_canonical bounded retraction only
  other_relations: directional conformance, preservation, realization, or traceability

nodes:
  - id: FPR-00
    title: accepted product decision
    state: closed-decision-altitude
    applicability: applies
    release_timing: closed-prerequisite
    work_kind: decision
    owner_route: external DomainSpec-v2 Owners
    dependencies: []
    artifacts:
      - projects/domainspec-v2/development/first-production-release/decisions/2026-07-12-product-release-contract.md
      - projects/domainspec-v2/development/first-production-release/tools/check-decision-reopen.cjs
    proof: accepted decision remains current and every reopen uses a recorded contract trigger
    negative_controls: [silent scope widening, implicit reopen, production inference]
    exit: decision branch stays closed
    omission: product direction becomes ambiguous
    next_move: preserve decision and execute FPR-01
    evidence_provenance: [accepted-decision, approved-findings:FPR-00]
    reopen_trigger: accepted product boundary changes

  - id: FPR-01
    title: authority baseline
    state: closed-ratified
    applicability: applies
    release_timing: closed-prerequisite
    work_kind: capability-and-owner-decision
    owner_route: definitions, validation, and layering owners through existing gates
    dependencies: [FPR-00]
    artifacts:
      - projects/domainspec-v2/development/first-production-release/authority-baseline.yml
      - projects/domainspec-v2/development/first-production-release/evidence/authority-baseline-ratification.json
    proof: one owner-ratified, non-contradictory active baseline
    negative_controls: [mutated authority count, stale projection reference, conflicting ontology direction]
    exit: 13/14, 24/25, 30/31, composability, projection, and direction conflicts are disposed
    omission: every downstream denominator may select stale authority
    next_move: preserve the digest-bound receipt and reopen only on the named authority-change trigger
    evidence_provenance: [research:Agent-1-executive-verdict, prior-roadmap:R1, task-session:SWU-FPR01-004]
    reopen_trigger: authority source, count, status, or direction changes

  - id: FPR-02
    title: backend and UI profile lane separation
    state: closed-lane-split
    applicability: applies
    release_timing: closed-coordination-prerequisite
    work_kind: decision
    owner_route: claim and semantic owners through invoke and decision-gate
    dependencies: [FPR-01]
    artifacts:
      - projects/domainspec-v2/development/first-production-release/decisions/2026-07-17-fpr02-supported-profile-decision.md
      - projects/domainspec-v2/development/first-production-release/profile-lanes/README.md
      - projects/domainspec-v2/development/first-production-release/profile-lanes/fpr02-lanes.yml
    proof: backend release and UI development have distinct lane IDs, execution owners, receipts, next moves, and promotion targets with no cross-lane completion dependency
    negative_controls: [implicit lane join, sibling blocker propagation, shared status overwrite, automatic UI release admission]
    exit: FPR-02B and FPR-02U are independently resumable and neither can mutate or advance the other
    omission: UI and backend residue can silently block each other or share an ambiguous profile denominator
    next_move: resume FPR-02B decisions or FPR-02U SWU-UIP-005 independently
    evidence_provenance: [operator-decision:2026-07-17, invoke-refresh:fpr02-lane-separation]
    reopen_trigger: a lane becomes dependent on the sibling, a shared substrate invariant fails, or a UI-inclusive release is proposed

