    evidence_provenance: [research:Agent-3-BW-11, prior-roadmap:R10]
    reopen_trigger: candidate, Body War source, critical-step denominator, operator, verifier, or support route changes

  - id: FPR-14
    title: Craft continuation equality
    state: seeded-not-closed
    applicability: applies
    release_timing: blocks-claim-acceptance-then-ongoing
    work_kind: operation
    owner_route: Craft owner
    dependencies: [FPR-13]
    artifacts:
      - projects/domainspec-v2/.craft/ledger.yml
      - projects/domainspec-v2/development/first-production-release/craft/expected-node-edge-manifest.yml
      - projects/domainspec-v2/development/first-production-release/evidence/craft/craft-equality-receipt.json
      - projects/domainspec-v2/development/first-production-release/tools/validate-craft-release-context.cjs
    proof: expected and actual node, edge, field, artifact, receipt, frontier, next-move, and reopen-trigger sets are exactly equal
    negative_controls: [missing node, extra release node, missing edge, missing proof, residue only in prose, Inventory-only frontier]
    exit: exact Craft equality and no known release residue exists only in prose or Inventory
    omission: the strategy cannot persist or reopen safely
    next_move: keep this manifest and the live Craft context synchronized as nodes close
    evidence_provenance: [research:Agent-3-Craft-ready-frontier, prior-roadmap:R12]
    reopen_trigger: any node, edge, artifact, receipt, frontier, owner, proof, next move, or trigger changes

  - id: FPR-15
    title: claim acceptance, authorization, and release
    state: unauthorized
    applicability: applies
    release_timing: blocks-release-act
    work_kind: decision-and-operation
    owner_route: claim owner, distinct proposer and approver, independent verifier, external owners, release operator
    dependencies: [FPR-13, FPR-14]
    artifacts:
      - projects/domainspec-v2/releases/RELEASE-ID/release-manifest.json
      - projects/domainspec-v2/releases/RELEASE-ID/claim-acceptance.json
      - projects/domainspec-v2/releases/RELEASE-ID/release-authorization.json
      - projects/domainspec-v2/releases/RELEASE-ID/manifest.sha256
      - projects/domainspec-v2/releases/RELEASE-ID/distribution-receipt.json
      - refs/tags/RELEASE-ID
    proof: exact SHA, profile, planes, evidence, tool/solver/receipt digests, claims, limitations, roles, support, and withdrawal are bound; proposer differs from approver; verifier did not author evidence
    negative_controls: [changed bit, changed claim, same proposer and approver, evidence-author verifier, missing support, missing withdrawal]
    exit: exact private bits and claims are externally authorized and released append-only
    omission: the technical system self-authorizes or the wrong bits ship
    next_move: remain unauthorized until a real candidate and governed owners exist
    evidence_provenance: [accepted-decision:release-authority, research:Agent-1-section-7, research:Agent-3-BW-12]
    reopen_trigger: any candidate bit, claim, actor, evidence digest, channel, support, compatibility, or withdrawal term changes

