    negative_controls: [empty profile, unknown type, UI type, absent root, placeholder owner, missing obligation kind, unresolved origin, empty redaction allowlist]
    exit: exact backend concepts, relations, documents, commands, writes, languages, obligations, roots, generated artifacts, failures, claims, and pilot route are frozen
    omission: denominators, behavior, interfaces, and pilot relevance remain undefined
    next_move: resume SWU-FPR02-001 at the four remaining backend/profile/pilot decision groups
    evidence_provenance: [accepted-decision, research:Agent-2-E1, research:Agent-3-BW-01, operator-decision:2026-07-17]
