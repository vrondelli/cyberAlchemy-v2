frontiers:
  - id: FR-FPR-ONTOLOGY-DIRECTION
    state: triaged
    owner_route: semantic owner and definitions governance
    blocks: [FPR-03]
    condition: reconcile active contract-to-authoring ontology lens with the accepted business-plane-to-Spec chain
    trigger: change to ontology, business-plane, or Spec authority semantics
  - id: FR-FPR-SOLVER-PROFILE
    state: triaged
    owner_route: formal-validation and semantic owners
    blocks: [FPR-06]
    condition: select literal languages, solver versions, bounds, timeout, and fairness/liveness policy
    trigger: change to supported formal claim, translator, solver, or bounds
  - id: FR-FPR-BW-ORIGIN-ROUTE
    state: triaged
    owner_route: Body War product/security owners and DomainSpec claim owner
    blocks: [FPR-10]
    condition: decide real-provider callback, deployment, origin, consent, and redaction allowlist
    trigger: change to provider, callback, deployment, origin, consent, redaction, or claim
  - id: FR-FPR-I-ROOT-DISPOSITIONS
    state: triaged
    owner_route: implementation/platform owner
    blocks: [FPR-08]
    condition: ratify production, test, generated, static-JS, and non-code root dispositions
    trigger: change to Body War roots, build outputs, parser/toolchain, or dynamic behavior
  - id: FR-FPR-APE-SELF-CONTAINMENT
    state: triaged
    owner_route: layering governance and runtime owner
    blocks: [FPR-05]
    condition: prove v2 catalogs are self-contained or promote the shared-method dependency
    trigger: any release proof or runtime dependency on private v1 architecture material

