persistent_protocol:
  states: [observed, triaged, researching, proposed, accepted, rejected, deferred, scheduled, verified, closed]
  transitions:
    - observed-to-triaged
    - triaged-to-researching-or-proposed-or-rejected-or-deferred
    - researching-to-proposed-or-rejected-or-deferred
    - proposed-to-accepted-to-scheduled-to-verified-to-closed
    - rejected-or-deferred-or-verified-or-closed-to-triaged-on-trigger
  evidence_expiry_inputs:
    - candidate SHA
    - supported profile
    - authoritative B or Spec
    - mapping or quotient
    - toolchain or solver bounds
    - source roots
    - normalization policy
    - relevant implementation
  research_dispatch_gate:
    - material node or applicability dependency
    - subagent trigger passes
    - tensioned sheet
    - explicit human confirmation
    - dispatch registration
    - append-only closeout
