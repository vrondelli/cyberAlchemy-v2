      (build-from-owned on validate-relationships.ts; no engine delta-rule import — shape only). Discriminating
      fixtures: entity-ok PASS, entity-bad (VO-shaped, no identity + Equality clause) REJECTED as Entity;
      deterministic on re-run. Global gate green — validate RC 0, engine:test 97/97, typecheck RC 0.
      validate:content added as a standalone npm script (NOT yet in the validate aggregate — that is MT4).
      Placement resolved: the meta-types tree roots at impl/spec/meta-types/<category>/.
