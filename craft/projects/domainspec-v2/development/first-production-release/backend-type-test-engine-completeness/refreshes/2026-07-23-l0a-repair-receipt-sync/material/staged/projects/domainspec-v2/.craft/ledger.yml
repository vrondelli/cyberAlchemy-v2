  - description_id: DESC-DSV2-METATYPE-003
    context_id: CTX-DSV2-META-TYPE-FORMALIZATION
    description: >-
      2026-07-02 — MT2 (Behavioral) executed. Owner decision (AskUserQuestion): behavioral discriminators
      declared in an "Attribute | Value" table; validator gains the attribute-equals rule kind. All 7 types
      (Operation, Query, Calculation, Rule, Policy, Workflow, Saga) authored as schema+md pairs + pos/neg
