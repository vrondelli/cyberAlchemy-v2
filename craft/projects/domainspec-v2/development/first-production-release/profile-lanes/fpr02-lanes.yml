schema_version: fpr02-lanes/v1
family_id: FPR-02
status: lane-split-resolved
production_authorized: false
decision_ref: ../decisions/2026-07-17-fpr02-supported-profile-decision.md
baseline_ref: ../evidence/authority-baseline-ratification.json

lanes:
  - lane_id: FPR-02B
    title: backend first-release profile
    purpose: >-
      Freeze and validate the exact backend profile, Body War pilot boundary,
      claims, negatives, rollback, origin, redaction, and stable digest for the
      first private release.
    authority: claim-and-semantic-owners
    lifecycle_owner: ../foundation-execution/work-pack/tasks/TASK-FPR-02-SUPPORTED-PROFILE.md
    state: decision-in-progress
    dependencies: [FPR-01, FPR-02]
    independent_of: [FPR-02U]
    exact_backend_type_ids:
      - DS-D1.1
      - DS-D1.2
      - DS-D1.3
      - DS-D1.4
      - DS-D1.5
      - DS-D1.6
      - DS-D1.7
      - DS-D1.8
      - DS-D1.9
      - DS-D1.11
      - DS-D1.12
      - DS-D1.13
      - DS-D1.14
    ui_disposition: excluded-from-this-lane
    next_swu: SWU-FPR02-001
    remaining_decision_groups: 4
    opens_when_complete: [FPR-03, FPR-10, FPR-11]
    release_admission: owner-gated

  - lane_id: FPR-02U
    title: required UI development profile
    purpose: >-
      Implement and validate the eleven required-by-design UI concepts in a
      development-only profile, then produce exact DS-D1, DS-D8, and profile
      owner deltas without blocking the backend release lane.
    authority: development-only
    lifecycle_owner: ../../ui-profile-implementation/WORK-PACK.md
    state: in-progress
    dependencies: [FPR-01, FPR-02]
    independent_of: [FPR-02B]
    required_ui_concept_ids:
      - DS-D1.15
      - DS-D1.16
      - DS-D1.17
      - DS-D1.18
      - DS-D1.19
      - DS-D1.20
      - DS-D1.21
      - DS-D1.22
      - DS-D1.23
      - DS-D1.24
      - DS-D1.25
    backend_disposition: out-of-scope-for-this-lane
    completed_swu_ids:
      - SWU-UIP-001
      - SWU-UIP-002
      - SWU-UIP-003
      - SWU-UIP-004
    next_swu: SWU-UIP-005
    remaining_swu_ids:
      - SWU-UIP-005
      - SWU-UIP-006
      - SWU-UIP-007
    opens_when_complete: [future-ui-authority-decision]
    release_admission: not-implied

coordination:
  cross_lane_completion_dependency: none
  shared_substrate:
    - ratified FPR-01 baseline
    - existing DomainSpec compiler and graph/view contracts
    - versioned criterion and profile interfaces
  path_policy: lane-owned artifacts, fixtures, receipts, and profile identifiers stay distinct
  blocking_policy: a lane blocker affects only that lane unless a concrete shared-invariant failure is recorded
  join_policy: no implicit join; a future UI-inclusive release requires a new explicit owner decision
  mutation_policy: neither lane may silently mutate the other lane or canonical authority
