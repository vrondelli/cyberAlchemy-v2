[workspace]
resolver = "2"
members = [
  "cyberAlchemy-v2/development/research/2026-08-29-define-cli-self-hosted-cloud-model-selection/capacity-curve",
  "cyberAlchemy-v2/development/research/2026-08-29-define-cli-self-hosted-cloud-model-selection/capacity-experiment-adapter",
]
exclude = [
  "projects/cyberalchemy-orchestrator/implementations/rwo-rust",
  "projects/domainspec-v2/impl/architecture-conformance/targets/rust",
]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
clap = { version = "=4.5.48", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
capacity-curve = { path = "cyberAlchemy-v2/development/research/2026-08-29-define-cli-self-hosted-cloud-model-selection/capacity-curve" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
