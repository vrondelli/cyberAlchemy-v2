[package]
name = "cyberalchemy-kep-devnet-trial"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bincode = "=1.3.3"
borsh = "=1.6.0"
cyberalchemy-knowledge-exchange-protocol = { path = ".." }
cyberalchemy-kep-adapters = { path = "../adapters" }
cyberalchemy-kep-solana-program = { path = "../solana-program" }
getrandom = "=0.4.3"
hex = "=0.4.3"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
solana-client = "=3.1.11"
solana-commitment-config = "=3.1.1"
solana-keypair = "=3.1.2"
solana-loader-v3-interface = { version = "=6.1.0", features = ["bincode"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.0.0"
thiserror = "=2.0.18"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
url = "=2.5.8"
zeroize = "=1.8.2"

[lints.rust]
unsafe_code = "deny"
