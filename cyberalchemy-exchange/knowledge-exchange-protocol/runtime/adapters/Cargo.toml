[package]
name = "cyberalchemy-kep-adapters"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cyberalchemy-knowledge-exchange-protocol = { path = ".." }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
hex = "=0.4.3"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }
thiserror = "=2.0.18"
zeroize = { version = "=1.8.2", features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"
