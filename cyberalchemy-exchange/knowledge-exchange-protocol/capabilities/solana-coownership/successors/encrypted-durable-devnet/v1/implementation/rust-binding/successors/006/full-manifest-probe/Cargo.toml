[package]
name = "ca2_kep_sol2_binding_006_full_manifest_probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
solana-account-info = { version = "=3.1.1", default-features = false }
solana-address = { version = "=2.6.1", default-features = false }
solana-instruction = { version = "=3.4.1", default-features = false, features = ["std"] }
solana-program-entrypoint = { version = "=3.1.1", default-features = false }
solana-program-error = { version = "=3.0.1", default-features = false }
solana-pubkey = { version = "=4.2.0", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["any", "migrate", "postgres", "runtime-tokio", "sqlite-bundled", "tls-rustls-ring"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
solana-keypair = { version = "=3.1.2", default-features = false }
solana-program-test = { version = "=4.2.2", default-features = false, features = ["agave-unstable-api"] }
solana-signer = { version = "=3.0.1", default-features = false }
solana-transaction = { version = "=4.1.4", default-features = false, features = ["wincode"] }

[lints.rust]
unsafe_code = "deny"
