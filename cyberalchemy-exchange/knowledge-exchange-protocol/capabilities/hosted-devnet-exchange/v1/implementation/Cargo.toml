[package]
name = "cyberalchemy-kep-hosted-devnet"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
ui = []

[workspace]

[[bin]]
name = "hosted"
path = "src/bin/hosted.rs"
required-features = ["ui"]

[dependencies]
axum = "=0.8.4"
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "postgres", "runtime-tokio", "tls-none"] }
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
chacha20poly1305 = "=0.11.0"
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
http-body-util = "=0.1.3"
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "deny"
