[package]
name = "kep-alchlang-local-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cyberalchemy-knowledge-exchange-protocol = { path = "../../../../runtime" }
cyberalchemy-kep-adapters = { path = "../../../../runtime/adapters" }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
p256 = { version = "=0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "=0.4.3"
zeroize = "=1.8.2"
