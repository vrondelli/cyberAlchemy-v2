services:
  operational-sql:
    image: cyberalchemy-dst3-postgres:17-local
    environment:
      POSTGRES_DB: durable_primary
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d durable_primary"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - operational_sql_data:/var/lib/postgresql/data

  recovery-journal:
    image: cyberalchemy-dst3-postgres:17-local
    environment:
      POSTGRES_DB: durable_journal
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d durable_journal"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - recovery_journal_data:/var/lib/postgresql/data

volumes:
  operational_sql_data:
  recovery_journal_data:
