[package]
name = "exchange-sbf-verification"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
members = ["kep-reference"]
[lib]
name = "cyberalchemy_exchange_purchase"
path = "../src/lib.rs"
[features]
devnet-deployment = ["cyberalchemy-kep-solana-program/devnet-deployment"]
default = ["no-entrypoint", "modern-sbf"]
no-entrypoint = []
modern-sbf = []
local-test-mint = []
[[test]]
name = "settlement"
path = "../tests/settlement.rs"
[dependencies]
cyberalchemy-kep-solana-program = { package = "kep-sbf-host-types", path = "kep-reference" }
borsh = { version = "=1.7.0", features = ["derive"] }
solana-program = "=4.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
spl-token-interface = "=3.0.0"
solana-compute-budget-interface = "=3.0.0"
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-account = "=4.3.1"
solana-instruction = "=3.4.0"
solana-pubkey = "=4.2.0"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.4"
tokio = { version = "=1.52.4", features = ["macros", "rt-multi-thread"] }
[profile.dev]
debug = 0
strip = "debuginfo"
