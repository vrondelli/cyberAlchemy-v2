[package]
name = "cyberalchemy-exchange-purchase"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
devnet-deployment = ["cyberalchemy-kep-solana-program/devnet-deployment"]
no-entrypoint = []
local-test-mint = []

[dependencies]
borsh = { version = "=1.6.0", features = ["derive"] }
solana-program = "=3.0.0"
solana-sdk-ids = "=3.0.0"
solana-system-interface = { version = "=3.0.0", features = ["bincode"] }
spl-token-interface = "=2.0.0"
cyberalchemy-kep-solana-program = { path = "../../../../knowledge-exchange-protocol/runtime/solana-program", features = ["no-entrypoint"] }

[dev-dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
serde_json = "=1.0.145"
solana-compute-budget-interface = "=3.1.0"
solana-program-test = "=3.1.11"
solana-sdk = "=3.0.0"
spl-token = { version = "=9.0.0", features = ["no-entrypoint"] }
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
