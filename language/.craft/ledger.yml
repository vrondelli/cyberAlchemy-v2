contexts:
  - context_id: CTX-LANGUAGE-ROOT
    parent_id: root
    title: CyberAlchemy Language Project
    purpose: Preserve business, domain, product, and system meaning without silently collapsing one representation into another.
    stage: define
    gate: flag
    next_move: Carry the defined Governance Program, Request, Fact, and Fact Set language into the candidate system-runtime ontology while the separate policy-language exercise remains open.
    owned_artifacts:
      - ART-LANGUAGE-LEDGER
      - ART-LANGUAGE-VIEW
      - ART-LANGUAGE-EXAMPLE
      - ART-LANGUAGE-VALIDATOR
      - ART-LANGUAGE-AUTHORITY
      - ART-LANGUAGE-KERNEL-EXAMPLE
    links:
      - label: Meaning context
        target: CTX-LANGUAGE-MEANING
        kind: row-id
      - label: Realization decision
        target: DEC-LANGUAGE-REALIZATION-001
        kind: row-id
      - label: Governance kernel language
        target: CTX-LANGUAGE-GOVERNANCE-KERNEL
        kind: row-id
    notes: The project structure is locally testable; semantic owner review remains open.
  - context_id: CTX-LANGUAGE-MEANING
    parent_id: CTX-LANGUAGE-ROOT
    title: Business and product meaning
    purpose: Name one concept in ordinary business, bounded-domain, and product language before selecting a technical realization.
    stage: define
    gate: pass
    next_move: Test the three meanings in the first Governance rule-review conversation and product flow.
    owned_artifacts:
      - ART-LANGUAGE-MEANINGS
    links:
      - label: Meaning bindings
        target: ART-LANGUAGE-MEANINGS
        kind: artifact-id
    notes: Recommendation and Decision Support Output are candidate-local terms.
  - context_id: CTX-LANGUAGE-EDGES
    parent_id: CTX-LANGUAGE-ROOT
    title: Earned edge vocabulary
    purpose: Require business meaning, product consequence, and a non-collapse witness before an edge verb can be adopted.
    stage: define
    gate: flag
    next_move: Exercise offers and informs, then resolve the produces collision without assuming a DomainSpec mapping.
    owned_artifacts:
      - ART-LANGUAGE-EDGES
    links:
      - label: Produces decision
        target: DEC-LANGUAGE-PRODUCES-001
        kind: row-id
    notes: offers and informs are proposed, not accepted vocabulary.
  - context_id: CTX-LANGUAGE-REALIZATION
    parent_id: CTX-LANGUAGE-ROOT
    title: DomainSpec realization
    purpose: Select a DomainSpec meta-type only from observed identity, equality, and lifecycle needs.
    stage: define
    gate: flag
    next_move: Decide whether Rule Review Recommendation requires independent identity and lifecycle.
    owned_artifacts:
      - ART-LANGUAGE-REALIZATIONS
    links:
      - label: Open selection
        target: DEC-LANGUAGE-REALIZATION-001
        kind: row-id
    notes: The open realization does not invalidate the business and product meanings.
  - context_id: CTX-LANGUAGE-GOVERNANCE-KERNEL
    parent_id: CTX-LANGUAGE-ROOT
    title: Governance kernel input language
    purpose: Define Governance Program, Request, Fact, and Fact Set and bind their meanings to the CyberAlchemy authority model without creating authority or enforcement.
    stage: define
    gate: flag
    next_move: Use the candidate language and authority bindings as Define input for the Governance system-runtime ontology and verifier-contract design.
    owned_artifacts:
      - ART-LANGUAGE-AUTHORITY
      - ART-LANGUAGE-KERNEL-EXAMPLE
      - ART-LANGUAGE-MEANINGS
      - ART-LANGUAGE-REALIZATIONS
    links:
      - label: Runtime realization gap
        target: GAP-LANGUAGE-KERNEL-RUNTIME-001
        kind: row-id
      - label: Authority bindings
        target: ART-LANGUAGE-AUTHORITY
        kind: artifact-id
    notes: The language slice and candidate DomainSpec mappings are owner-reviewed; the system-runtime ontology, verifier contracts, Rust types, Runtime Contract acceptance, and enforcement remain outside this Define apply.

  - context_id: CTX-LANGUAGE-ALCH-INFERENCE-SERVICE
    parent_id: CTX-LANGUAGE-ROOT
    title: Alch inference service declarations and generation
    purpose: Plan reusable generated service behavior across DomainSpec v2 and Alch, grounded in the existing inference host and support witnesses.
    stage: plan
    gate: flag
    next_move: 'Real Qwen/Qwen3.8-27B integration verified through the existing SSH tunnel and Alch/DomainSpec service: JSON and SSE completed with nonempty text and usage, about 2.35 seconds each. Local 228-test candidate remains verified. Prototype is usable at the running local endpoint; broader workloads, remote cancellation and deployment remain separate.'
    owned_artifacts:
    - ART-LANGUAGE-ALCH-SERVICE-PLAN
    - ART-LANGUAGE-ALCH-SERVICE-SUPPORT
    - ART-LANGUAGE-ALCH-SERVICE-CONTRACTS
    - ART-LANGUAGE-ALCH-SERVICE-DISCOVERY
    - ART-LANGUAGE-ALCH-SERVICE-ASSEMBLY
    - ART-LANGUAGE-ALCH-SERVICE-INVOCATION
    - ART-LANGUAGE-ALCH-SERVICE-STREAM
    - ART-LANGUAGE-ALCH-SERVICE-CUSTODY
    - ART-LANGUAGE-ALCH-SERVICE-REUSE
    - ART-LANGUAGE-ALCH-SERVICE-SECURITY-DESIGN
    - ART-LANGUAGE-ALCH-SERVICE-SECURITY
    links:
    - label: Shared service binding work plan
      target: ART-LANGUAGE-ALCH-SERVICE-PLAN
      kind: artifact-id
    notes: 'ISB-09 implemented last: Auth Foundation verification/current authorization, flat tenant membership, compiled catalog filtering, protected service and principal-private replay. 121 service, 16 contract and three compatibility tests pass; no live issuer or production admission claim. Live service-client successor: 12 real HTTPS issuer/introspection checks passed; disposable tenant policy and loopback provider cleaned up. Evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/live/README.md Browser consumer and enrollment successor implemented; evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/browser/README.md Real HTTPS browser ingress complete with temporary callback registration restored; evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/ingress/README.md Durable encrypted application state candidate complete; evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/durable/README.md
      Bounded OIDC renewal candidate complete with real issuer/browser and SQLite reopen checks; evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/renewal/README.md Durable inference request custody candidate complete with SQLite crash/replay tests; evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/durable-custody/README.md Trusted operator reconciliation candidate complete with authorization, evidence, version and fencing checks; evidence: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/reconciliation/README.md Provider evidence source inspection complete; provider/API selection required before implementation; plan: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/security/provider-evidence/PLAN.md Reviewed local inference scope implemented; pattern: capabilities/alchlang/plans/general-compiler-v1/extensions/inference-router-v1/local-pattern/README.md
