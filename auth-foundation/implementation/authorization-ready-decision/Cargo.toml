[package]
name = "auth-foundation-authorization-ready-decision"
version = "0.0.0"
edition = "2024"
publish = false

[features]
trace = ["dep:auth-foundation-authorization-trace"]

[dependencies]
auth-foundation-authorization-trace = { path = "../authorization-trace", optional = true }
auth-foundation-authorization-ready-authority = { path = "../authorization-ready-authority" }
auth-foundation-authorization-state-model = { path = "../authorization-state-model" }
auth-kernel = { package = "auth-foundation-operation-auth-exact-permission-authorize", path = "../standard-runtime" }

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[workspace]
