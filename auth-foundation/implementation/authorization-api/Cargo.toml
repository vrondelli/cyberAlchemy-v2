[package]
name = "auth-foundation-authorization-api"
version = "0.0.0"
edition = "2024"
publish = false

[features]
trace = ["dep:auth-foundation-authorization-trace", "auth-foundation-authorization-service/trace"]

[dependencies]
auth-foundation-authorization-trace = { path = "../authorization-trace", optional = true }
auth-foundation-authorization-service = { path = "../authorization-service" }
auth-foundation-authorization-state-model = { path = "../authorization-state-model" }
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
auth-foundation-authorization-admission-service = { path = "../authorization-admission-service" }
auth-foundation-authorization-ready-decision = { path = "../authorization-ready-decision" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }

[workspace]
