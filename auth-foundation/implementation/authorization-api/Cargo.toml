[package]
name = "auth-foundation-authorization-api"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
auth-foundation-authorization-service = { path = "../authorization-service" }
auth-foundation-runtime-adapter = { path = "../runtime-adapter" }
auth-foundation-trusted-boundary = { path = "../trusted-boundary" }
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }

[workspace]
