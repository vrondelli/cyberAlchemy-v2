[package]
name = "auth-foundation-authorization-ready-authority"
version = "0.0.0"
edition = "2024"
publish = false

[features]
trace = ["dep:auth-foundation-authorization-trace"]

[dependencies]
auth-foundation-authorization-trace = { path = "../authorization-trace", optional = true }
auth-foundation-authorization-metadata-reader = { path = "../authorization-metadata-reader" }
auth-foundation-authorization-state-model = { path = "../authorization-state-model" }
auth-foundation-authorization-state-reader = { path = "../authorization-state-reader" }
auth-foundation-command-boundary-v2-auth-command-boundary-admit-authorization-command = { path = "../command-boundary-runtime-v2" }
auth-foundation-trusted-input-reader = { path = "../trusted-input-reader" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[workspace]
