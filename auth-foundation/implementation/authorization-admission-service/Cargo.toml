[package]
name = "auth-foundation-authorization-admission-service"
version = "0.0.0"
edition = "2024"
publish = false

[features]
trace = ["dep:auth-foundation-authorization-trace", "auth-foundation-authorization-ready-authority/trace", "auth-foundation-authorization-ready-decision/trace"]

[dependencies]
auth-foundation-authorization-trace = { path = "../authorization-trace", optional = true }
auth-foundation-authorization-ready-authority = { path = "../authorization-ready-authority" }
auth-foundation-authorization-state-model = { path = "../authorization-state-model" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[dev-dependencies]
auth-foundation-authorization-ready-decision = { path = "../authorization-ready-decision" }

[workspace]
