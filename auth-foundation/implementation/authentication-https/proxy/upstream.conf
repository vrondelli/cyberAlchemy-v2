proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host localhost:__ISSUER_PORT__;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host localhost:__ISSUER_PORT__;
proxy_set_header X-Forwarded-Port __ISSUER_PORT__;
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Original-Method "";
proxy_ssl_server_name on;
proxy_ssl_name keycloak;
proxy_ssl_trusted_certificate /tls/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_connect_timeout 3s;
proxy_read_timeout 10s;
proxy_pass https://keycloak:8443;
