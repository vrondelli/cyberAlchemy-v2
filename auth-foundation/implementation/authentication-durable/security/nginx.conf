pid /tmp/nginx.pid;
error_log /dev/stderr crit;
worker_processes 1;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  # Record only status, method and route class; never URLs, queries, cookies or credentials.
  map $uri $auth_route { default issuer; ~^/resources/ asset; }
  map $status $auth_failure { default 0; ~^[45] 1; }
  log_format bounded_auth '$time_iso8601 status=$status method=$request_method route=$auth_route';
  access_log /dev/stdout bounded_auth if=$auth_failure;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 32k;
  client_header_timeout 5s;
  client_body_timeout 5s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=auth:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=assets:1m rate=100r/s;
  limit_req_status 429;
  ssl_certificate /tls/frontend.crt;
  ssl_certificate_key /tls/frontend.key;
  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_session_tickets off;
  # Do not send HSTS for shared localhost: it would affect the predecessor on other ports.
  map "$http_forwarded$http_x_forwarded_for$http_x_forwarded_host$http_x_forwarded_proto$http_x_forwarded_port$http_x_forwarded_prefix$http_x_real_ip$http_x_original_url$http_x_original_method" $spoofed { "" 0; default 1; }
  server {
    listen 13443 ssl;
    server_name localhost;
    if ($http_host != "localhost:13443") { return 421; }
    if ($spoofed) { return 400; }
    limit_req zone=auth burst=40 nodelay;
    location / {
      proxy_set_header Host localhost:13443;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host localhost:13443;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Port 13443;
      proxy_read_timeout 12s;
      proxy_pass http://unix:/appsocket/app.sock;
    }
  }
  server {
    listen 18443 ssl;
    server_name localhost;
    if ($http_host != "localhost:18443") { return 421; }
    if ($spoofed) { return 400; }
    limit_req zone=auth burst=40 nodelay;
    location /realms/auth-https/ { include /etc/nginx/upstream.conf; }
    location /resources/ { limit_req zone=assets burst=200 nodelay; include /etc/nginx/upstream.conf; }
    location / { return 404; }
  }
  server {
    listen 19443 ssl;
    server_name localhost;
    if ($http_host != "localhost:19443") { return 421; }
    if ($spoofed) { return 400; }
    ssl_client_certificate /tls/ca.crt;
    ssl_verify_client on;
    location = /admin/realms/auth-https { include /etc/nginx/upstream.conf; }
    location /admin/realms/auth-https/ { include /etc/nginx/upstream.conf; }
    location = /realms/auth-https/protocol/openid-connect/token { include /etc/nginx/upstream.conf; }
    location / { return 404; }
  }
}
