services:
  postgres:
    restart: unless-stopped
    image: postgres:17.6
    environment:
      POSTGRES_USER: auth_durable_admin
      POSTGRES_PASSWORD: ${DURABLE_DB_PASSWORD:?private fixture environment required}
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:55493:5432"]
    volumes: ["durable-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_durable_admin -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
volumes:
  durable-data:
