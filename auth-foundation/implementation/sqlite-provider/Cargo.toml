[package]
name = "auth-foundation-sqlite-provider"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
legacy-raw-decision = [
    "dep:auth-foundation-authorization-state-reader",
    "dep:auth-foundation-runtime-adapter",
    "dep:rusqlite",
    "auth-foundation-runtime-adapter/legacy-raw-decision",
]

[dependencies]
auth-foundation-authorization-state-reader = { path = "../authorization-state-reader", optional = true }
auth-foundation-runtime-adapter = { path = "../runtime-adapter", optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"], optional = true }

[workspace]
