name: auth-foundation-prototype
services:
  postgres:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${AUTH_PROTO_DB_PASSWORD:?Run setup first}
    volumes:
      - auth-prototype-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54
    command: [start-dev, --import-realm, --spi-theme--static-max-age=-1, --spi-theme--cache-themes=false, --spi-theme--cache-templates=false]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${AUTH_PROTO_DB_PASSWORD:?Run setup first}
      KC_BOOTSTRAP_ADMIN_USERNAME: prototype-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_PROTO_ADMIN_PASSWORD:?Run setup first}
      KC_HOSTNAME: http://localhost:18080
      KC_HTTP_ENABLED: 'true'
    ports:
      - 127.0.0.1:18080:8080
    volumes:
      - ./themes/auth-foundation:/opt/keycloak/themes/auth-foundation:ro
      - ./.runtime/realm.json:/opt/keycloak/data/import/auth-prototype.json:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  auth-prototype-db:
