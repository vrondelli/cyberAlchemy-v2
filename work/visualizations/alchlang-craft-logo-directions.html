<section id="acl-logo-directions" aria-label="AlchLang and Craft separate logo directions">
  <style>
    #acl-logo-directions { color: light-dark(#242520, #eceee7); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    #acl-logo-directions * { box-sizing: border-box; }
    #acl-logo-directions .acl-head { margin-bottom: 22px; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    #acl-logo-directions .acl-head p { margin: 0 0 7px; color: #e35f50; font-size: 10px; font-weight: 760; letter-spacing: .16em; text-transform: uppercase; }
    #acl-logo-directions .acl-head h2 { margin: 0; font-family: Georgia, serif; font-size: clamp(25px, 4vw, 38px); font-weight: 500; letter-spacing: -.035em; }
    #acl-logo-directions .acl-surface { display: flex; border: 1px solid light-dark(#d9d7ce, #41443e); border-radius: 7px; overflow: hidden; }
    #acl-logo-directions .acl-surface button { min-height: 34px; padding: 0 13px; border: 0; background: transparent; color: light-dark(#6b6c65, #aeb1a9); font-size: 10px; cursor: pointer; }
    #acl-logo-directions .acl-surface button[aria-pressed="true"] { background: light-dark(#242520, #eceee7); color: light-dark(#f5f2e9, #242520); }
    #acl-logo-directions .acl-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #acl-logo-directions .acl-family { padding: 18px; border: 1px solid light-dark(#d9d7ce, #41443e); border-radius: 10px; background: light-dark(#f5f2e9, #242622); }
    #acl-logo-directions .acl-family-head { margin-bottom: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
    #acl-logo-directions .acl-family-head h3 { margin: 0; font-size: 17px; letter-spacing: -.025em; }
    #acl-logo-directions .acl-family-head span { color: light-dark(#74766e, #9da098); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    #acl-logo-directions .acl-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #acl-logo-directions .acl-option { min-width: 0; padding: 15px 9px 12px; border: 1px solid light-dark(#dddcd4, #3b3e39); border-radius: 7px; background: light-dark(#fbf9f3, #1d1f1c); color: inherit; text-align: left; cursor: pointer; }
    #acl-logo-directions .acl-option:hover { border-color: #a9aa9f; }
    #acl-logo-directions .acl-option[aria-pressed="true"] { border-color: #e35f50; box-shadow: inset 0 0 0 1px #e35f50; }
    #acl-logo-directions .acl-option svg { width: 64px; height: 64px; display: block; margin: 0 auto 13px; }
    #acl-logo-directions .acl-option strong { display: block; overflow: hidden; font-size: 11px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    #acl-logo-directions .acl-option small { display: block; margin-top: 4px; color: light-dark(#777970, #989c93); font-size: 8px; letter-spacing: .06em; text-align: center; text-transform: uppercase; }
    #acl-logo-directions .acl-preview { margin-top: 14px; min-height: 184px; padding: 28px clamp(20px, 4vw, 48px); border-radius: 10px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 34px; transition: background .18s, color .18s; }
    #acl-logo-directions .acl-preview[data-surface="light"] { border: 1px solid #d8d4ca; background: #f3eee4; color: #242520; }
    #acl-logo-directions .acl-preview[data-surface="dark"] { border: 1px solid #343733; background: #1d1f1c; color: #f0f1eb; }
    #acl-logo-directions .acl-lockup { display: flex; align-items: center; gap: 14px; }
    #acl-logo-directions .acl-lockup:last-child { justify-self: end; }
    #acl-logo-directions .acl-lockup svg { width: 58px; height: 58px; flex: 0 0 auto; }
    #acl-logo-directions .acl-word { display: flex; flex-direction: column; }
    #acl-logo-directions .acl-word strong { font-size: clamp(18px, 2.5vw, 26px); letter-spacing: -.045em; }
    #acl-logo-directions .acl-word small { margin-top: 4px; color: #e35f50; font-size: 8px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    #acl-logo-directions .acl-plus { color: #e35f50; font-family: Georgia, serif; font-size: 24px; font-style: italic; }
    #acl-logo-directions .acl-note { margin: 9px 1px 0; color: light-dark(#6e7068, #a1a49c); font-size: 10px; text-align: center; }
    @media (max-width: 700px) {
      #acl-logo-directions .acl-head { align-items: flex-start; flex-direction: column; }
      #acl-logo-directions .acl-columns { grid-template-columns: 1fr; }
      #acl-logo-directions .acl-preview { grid-template-columns: 1fr; gap: 19px; }
      #acl-logo-directions .acl-lockup, #acl-logo-directions .acl-lockup:last-child { justify-self: start; }
      #acl-logo-directions .acl-plus { display: none; }
    }
    @media (max-width: 390px) {
      #acl-logo-directions .acl-family { padding: 12px; }
      #acl-logo-directions .acl-option { padding-inline: 5px; }
      #acl-logo-directions .acl-option svg { width: 52px; height: 52px; }
      #acl-logo-directions .acl-option strong { font-size: 9px; }
    }
  </style>

  <div class="acl-head">
    <div><p>Separate identities · shared family</p><h2>Choose one mark for each product</h2></div>
    <div class="acl-surface" role="group" aria-label="Preview surface">
      <button type="button" data-surface="light" aria-pressed="true">Light</button>
      <button type="button" data-surface="dark" aria-pressed="false">Dark</button>
    </div>
  </div>

  <div class="acl-columns">
    <section class="acl-family" aria-labelledby="acl-alch-title">
      <div class="acl-family-head"><h3 id="acl-alch-title">AlchLang</h3><span>meaning → language</span></div>
      <div class="acl-options" role="group" aria-label="AlchLang logo candidates">
        <button class="acl-option" type="button" data-family="alch" data-index="0" aria-pressed="true">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="M17 56 34.5 15 52 56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square"/><path d="M25 42h21" fill="none" stroke="#e35f50" stroke-width="5"/><rect x="31" y="38" width="8" height="8" rx="1" fill="#e35f50" transform="rotate(45 35 42)"/></svg>
          <strong>Transmutation A</strong><small>precise source</small>
        </button>
        <button class="acl-option" type="button" data-family="alch" data-index="1" aria-pressed="false">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="M27 14 13 22v28l14 8M45 14l14 8v28l-14 8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square"/><rect x="28" y="28" width="16" height="16" rx="2" fill="#e35f50" transform="rotate(45 36 36)"/><circle cx="36" cy="36" r="3.5" fill="currentColor"/></svg>
          <strong>Semantic Lens</strong><small>language bounded</small>
        </button>
        <button class="acl-option" type="button" data-family="alch" data-index="2" aria-pressed="false">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="m14 48 22-34 22 34" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="bevel"/><path d="m19 55 17-25 17 25" fill="none" stroke="#e35f50" stroke-width="4" stroke-linejoin="bevel"/><path d="M29 48h14" stroke="currentColor" stroke-width="5"/></svg>
          <strong>Layered Axiom</strong><small>meaning in layers</small>
        </button>
      </div>
    </section>

    <section class="acl-family" aria-labelledby="acl-craft-title">
      <div class="acl-family-head"><h3 id="acl-craft-title">Craft</h3><span>graph → code</span></div>
      <div class="acl-options" role="group" aria-label="Craft logo candidates">
        <button class="acl-option" type="button" data-family="craft" data-index="0" aria-pressed="true">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="M53 20a23 23 0 1 0 0 32" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="square"/><path d="m45 27 14 9-14 9z" fill="#e35f50"/><rect x="32" y="32" width="8" height="8" fill="currentColor"/></svg>
          <strong>Forge C</strong><small>compile forward</small>
        </button>
        <button class="acl-option" type="button" data-family="craft" data-index="1" aria-pressed="false">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="M12 22h23v13H22v25H12z" fill="currentColor"/><path d="M60 50H37V37h13V12h10z" fill="#e35f50"/><rect x="29" y="29" width="14" height="14" fill="none" stroke="currentColor" stroke-width="4"/></svg>
          <strong>Joinery</strong><small>typed assembly</small>
        </button>
        <button class="acl-option" type="button" data-family="craft" data-index="2" aria-pressed="false">
          <svg viewBox="0 0 72 72" aria-hidden="true"><path d="m36 10 23 13v27L36 63 13 50V23z" fill="none" stroke="currentColor" stroke-width="4"/><path d="m13 23 23 13 23-13M36 36v27" fill="none" stroke="currentColor" stroke-width="4"/><path d="m36 36 23-13v27L36 63z" fill="#e35f50" opacity=".92"/></svg>
          <strong>Compiled Block</strong><small>graph realized</small>
        </button>
      </div>
    </section>
  </div>

  <div class="acl-preview" data-surface="light" aria-label="Selected logos in a shared product lockup">
    <div class="acl-lockup"><span data-preview="alch"></span><span class="acl-word"><strong>AlchLang</strong><small>Author meaning</small></span></div>
    <span class="acl-plus">+</span>
    <div class="acl-lockup"><span data-preview="craft"></span><span class="acl-word"><strong>Craft</strong><small>Compile systems</small></span></div>
  </div>
  <p class="acl-note">Select any mark to compare the independent identities as one product family.</p>

  <script>
    (() => {
      const root = document.getElementById('acl-logo-directions');
      const state = { alch: '0', craft: '0', surface: 'light' };
      const marks = {
        alch: [
          '<svg viewBox="0 0 72 72" aria-hidden="true"><path d="M17 56 34.5 15 52 56" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square"/><path d="M25 42h21" fill="none" stroke="#e35f50" stroke-width="5"/><rect x="31" y="38" width="8" height="8" rx="1" fill="#e35f50" transform="rotate(45 35 42)"/></svg>',
          '<svg viewBox="0 0 72 72" aria-hidden="true"><path d="M27 14 13 22v28l14 8M45 14l14 8v28l-14 8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="square"/><rect x="28" y="28" width="16" height="16" rx="2" fill="#e35f50" transform="rotate(45 36 36)"/><circle cx="36" cy="36" r="3.5" fill="currentColor"/></svg>',
          '<svg viewBox="0 0 72 72" aria-hidden="true"><path d="m14 48 22-34 22 34" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="bevel"/><path d="m19 55 17-25 17 25" fill="none" stroke="#e35f50" stroke-width="4" stroke-linejoin="bevel"/><path d="M29 48h14" stroke="currentColor" stroke-width="5"/></svg>'
        ],
        craft: [
          '<svg viewBox="0 0 72 72" aria-hidden="true"><path d="M53 20a23 23 0 1 0 0 32" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="square"/><path d="m45 27 14 9-14 9z" fill="#e35f50"/><rect x="32" y="32" width="8" height="8" fill="currentColor"/></svg>',
          '<svg viewBox="0 0 72 72" aria-hidden="true"><path d="M12 22h23v13H22v25H12z" fill="currentColor"/><path d="M60 50H37V37h13V12h10z" fill="#e35f50"/><rect x="29" y="29" width="14" height="14" fill="none" stroke="currentColor" stroke-width="4"/></svg>',
          '<svg viewBox="0 0 72 72" aria-hidden="true"><path d="m36 10 23 13v27L36 63 13 50V23z" fill="none" stroke="currentColor" stroke-width="4"/><path d="m13 23 23 13 23-13M36 36v27" fill="none" stroke="currentColor" stroke-width="4"/><path d="m36 36 23-13v27L36 63z" fill="#e35f50" opacity=".92"/></svg>'
        ]
      };
      const preview = root.querySelector('.acl-preview');
      function render() {
        root.querySelector('[data-preview="alch"]').innerHTML = marks.alch[Number(state.alch)];
        root.querySelector('[data-preview="craft"]').innerHTML = marks.craft[Number(state.craft)];
        preview.dataset.surface = state.surface;
        root.querySelectorAll('.acl-option').forEach((button) => button.setAttribute('aria-pressed', String(state[button.dataset.family] === button.dataset.index)));
        root.querySelectorAll('.acl-surface button').forEach((button) => button.setAttribute('aria-pressed', String(state.surface === button.dataset.surface)));
      }
      root.querySelectorAll('.acl-option').forEach((button) => button.addEventListener('click', () => { state[button.dataset.family] = button.dataset.index; render(); }));
      root.querySelectorAll('.acl-surface button').forEach((button) => button.addEventListener('click', () => { state.surface = button.dataset.surface; render(); }));
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, 'alch', { label: 'AlchLang mark', options: [{label:'Transmutation A',value:'0'},{label:'Semantic Lens',value:'1'},{label:'Layered Axiom',value:'2'}], reference: 'identity.alchlang' });
        tweak.addSelect(state, 'craft', { label: 'Craft mark', options: [{label:'Forge C',value:'0'},{label:'Joinery',value:'1'},{label:'Compiled Block',value:'2'}], reference: 'identity.craft' });
        tweak.addSelect(state, 'surface', { label: 'Surface', options: ['light','dark'], reference: 'identity.surface' });
      }
    })();
  </script>
</section>
