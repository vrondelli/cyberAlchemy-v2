[package]
name = "essays-agent-runtime"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "essays"
path = "src/bin/essays.rs"

[[bin]]
name = "essaysd"
path = "src/bin/essaysd.rs"

[[bin]]
name = "essays-ipc"
path = "src/bin/essays-ipc.rs"
